<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bitácora</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ==== 00-tokens.css ==== */
/* Tokens de Bitácora. Tema oscuro único, heredado de Weeklog (app.py 68-113):
   técnico, sobrio, "flight software". No hay modo claro por decisión, no por olvido. */
:root{
  --bg:#0a0f14;
  --panel:#111820;
  --panel2:#17212a;
  --panel3:#1d2a35;
  --grid:#293844;
  --grid-soft:#1c2730;
  --text:#eef4f7;
  --muted:#91a1ad;
  --muted2:#657583;
  --accent:#59d3df;
  --accent-hover:#74d7e2;
  --accent-dim:#173239;
  --danger:#d98282;
  --danger-bg:#2a1b20;
  --danger-bg-hover:#3a252a;
  --success:#83b68c;
  --success-bg:#12231e;
  --success-edge:#285343;
  --warn:#d9b46f;
  --warn-bg:#2e2718;
  --class-bg:#1e2932;
  --class-edge:#3c4c58;
  --status-bg:#0f161c;
  --gutter-bg:#121a21;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"DejaVu Sans Mono",monospace;

  --radius:6px;
  --radius-lg:10px;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75);

  /* geometria del calendario (Weeklog): 58 px/hora, cabecera 68, canal 58 */
  --hour-h:58px;
  --cal-header-h:68px;
  --time-gutter:58px;

  --nav-h:52px;
  --header-h:54px;
}


/* ==== 01-base.css ==== */
/* Reset y piezas basicas compartidas por todas las pantallas. */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.4;height:100%;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
::selection{background:rgba(89,211,223,.28)}
[hidden]{display:none!important}

/* tipografia */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kicker{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.kicker.accent{color:var(--accent)}
.section-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0}
.small{font-size:12px;color:var(--muted)}
.tiny{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.muted{color:var(--muted)} .muted2{color:var(--muted2)} .accent{color:var(--accent)}
.danger{color:var(--danger)} .success{color:var(--success)} .warn{color:var(--warn)}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowrap{white-space:nowrap}
.right{text-align:right}
.hidden{display:none!important}

/* superficies */
.card{background:var(--panel);border:1px solid var(--grid);border-radius:var(--radius)}
.card2{background:var(--panel2);border:1px solid var(--grid);border-radius:var(--radius)}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rail,var(--accent));
  border-radius:var(--radius) 0 0 var(--radius)}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--grid);margin:12px 0}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 12px;border-radius:var(--radius);background:var(--panel2);color:var(--muted);
  border:1px solid var(--grid);font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s;user-select:none}
.btn:hover{background:var(--panel3);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--bg)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:#3a252a}
.btn.danger:hover{background:var(--danger-bg-hover);color:var(--text)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.compact{padding:5px 9px;font-size:11.5px}
.btn.mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em}
.btn.icon{width:30px;height:30px;padding:0;font-family:var(--mono);font-size:14px;font-weight:700}
.btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btnbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* formularios */
.label{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.input,.select,.textarea{width:100%;background:var(--panel2);border:1px solid var(--grid);
  border-radius:var(--radius);padding:9px 10px;color:var(--text);outline:none;
  transition:border-color .12s,box-shadow .12s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(89,211,223,.15)}
.input.mono{font-family:var(--mono)}
.input.bad{border-color:var(--danger)}
.textarea{min-height:120px;resize:vertical;line-height:1.45}
.select{appearance:none;-webkit-appearance:none;padding-right:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2391a1ad' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
.select option{background:var(--panel2);color:var(--text)}
.field{margin-bottom:12px}
.fields{display:grid;gap:10px}
.fields.c2{grid-template-columns:1fr 1fr}
.fields.c3{grid-template-columns:1fr 1fr 1fr}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:15px;height:15px;accent-color:var(--accent)}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--grid);border-radius:4px;background:var(--panel2)}

/* tablas */
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid)}
.table td{padding:7px 8px;border-bottom:1px solid var(--grid-soft);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.table-wrap{overflow-x:auto}

/* tarjetas de metrica (telemetria, historial) */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.metric{background:var(--panel);border:1px solid var(--grid);border-radius:var(--radius);padding:8px 10px;min-width:0}
.metric .k{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.metric .v{font-size:16px;font-weight:700;margin-top:2px;color:var(--metric,var(--text));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .s{font-family:var(--mono);font-size:10px;color:var(--muted2);margin-top:2px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid var(--grid);
  background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.open{background:var(--success-bg);border-color:var(--success-edge);color:var(--success)}
.chip.warn{background:var(--warn-bg);border-color:#4a3d1f;color:var(--warn)}
.chip.bad{background:var(--danger-bg);border-color:#3a252a;color:var(--danger)}
.chip.accent{background:var(--accent-dim);border-color:#245057;color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,7,10,.72);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:100;animation:fade .14s ease}
.modal{background:var(--panel);border:1px solid var(--grid);border-radius:var(--radius-lg);
  width:100%;max-width:var(--modal-w,560px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);
  display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .16s ease;overflow:hidden}
.modal-head{background:var(--panel2);padding:12px 16px;border-bottom:1px solid var(--grid);
  display:flex;align-items:flex-start;gap:12px;position:relative}
.modal-head.railed{padding-left:20px}
.modal-head.railed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rail,var(--accent))}
.modal-head .kicker{margin-bottom:2px}
.modal-title{font-size:15px;font-weight:700;margin:0}
.modal-x{margin-left:auto;width:28px;height:28px;border-radius:var(--radius);color:var(--muted);font-size:16px;line-height:1}
.modal-x:hover{background:var(--panel3);color:var(--text)}
.modal-body{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.modal-foot{padding:10px 16px 14px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--grid-soft)}
.modal-foot .spacer{flex:1}
.modal-foot .hint{font-family:var(--mono);font-size:10px;color:var(--muted2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .modal-backdrop,.modal,.toast,.pantalla{animation:none!important}
  *{transition:none!important}
}
@media(max-width:759px){
  .modal-backdrop{padding:0;align-items:stretch}
  .modal{max-width:none;max-height:none;height:100vh;height:100dvh;border-radius:0;border:0}
}

/* toasts */
#toasts{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:200;
  pointer-events:none;max-width:min(92vw,380px)}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--grid);border-left:3px solid var(--accent);
  color:var(--text);padding:9px 12px;border-radius:var(--radius);font-size:12.5px;box-shadow:var(--shadow);
  animation:rise .16s ease}
.toast.bad{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast.ok{border-left-color:var(--success)}

/* estados vacios */
.empty{padding:22px 16px;text-align:center;color:var(--muted2);font-size:13px}
.empty .kicker{margin-bottom:6px}

/* scrollbars discretas */
*{scrollbar-width:thin;scrollbar-color:var(--grid) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--grid);border-radius:6px;border:2px solid var(--panel)}
*::-webkit-scrollbar-track{background:transparent}

/* paleta de colores de eventos de Google (colorId 1..11) — rail y relleno apagados */
.gcol-1{--ev-edge:#7986cb;--ev-fill:#1c2038} .gcol-2{--ev-edge:#33b679;--ev-fill:#15302a}
.gcol-3{--ev-edge:#8e24aa;--ev-fill:#2a1a35} .gcol-4{--ev-edge:#e67c73;--ev-fill:#33201f}
.gcol-5{--ev-edge:#f6c026;--ev-fill:#33301b} .gcol-6{--ev-edge:#f5511d;--ev-fill:#33231b}
.gcol-7{--ev-edge:#039be5;--ev-fill:#132a36} .gcol-8{--ev-edge:#616161;--ev-fill:#24292d}
.gcol-9{--ev-edge:#3f51b5;--ev-fill:#1a1f36} .gcol-10{--ev-edge:#0b8043;--ev-fill:#132a20}
.gcol-11{--ev-edge:#d60000;--ev-fill:#31191c} .gcol-0{--ev-edge:var(--class-edge);--ev-fill:var(--class-bg)}


/* ==== 13-shell.css ==== */
/* Shell: cabecera, navegación, contenedor de pantallas, puerta de entrada. */
.hdr{height:var(--header-h);display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--grid);position:sticky;top:0;z-index:20}
.hdr .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.hdr .brand .name{font-family:var(--mono);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--accent)}
.hdr .brand .name span{color:var(--muted2);font-weight:600}
.hdr .brand .ver{font-family:var(--mono);font-size:9.5px;color:var(--muted2)}
.hdr nav{display:flex;gap:4px;margin-left:8px}
.hdr nav button{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:7px 12px;
  border-radius:var(--radius);color:var(--muted);border:1px solid transparent}
.hdr nav button:hover{color:var(--text);background:var(--panel2)}
.hdr nav button.on{color:var(--accent);background:var(--accent-dim);border-color:#245057}
.hdr .status{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr .sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted2);letter-spacing:.06em}
.hdr .sync .dot{background:var(--success)}
.hdr .sync.busy .dot{background:var(--warn);animation:pulse .9s infinite}
.hdr .sync.bad .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hdr .btn.icon{width:28px;height:28px}

.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.pad{padding:12px 16px}

.bottomnav{display:none}
@media(max-width:759px){
  .hdr{padding:0 12px;gap:8px}
  .hdr nav{display:none}
  .hdr .brand .ver{display:none}
  .bottomnav{display:flex;position:sticky;bottom:0;z-index:20;height:var(--nav-h);background:var(--panel);
    border-top:1px solid var(--grid);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav button .ico{font-size:15px;line-height:1}
  #app{padding-bottom:0}
}

/* puerta de entrada / carga */
.gate{flex:1;display:grid;place-items:center;padding:24px 16px}
.gate .card{width:100%;max-width:420px;padding:22px 20px}
.gate h1{font-family:var(--mono);font-size:16px;letter-spacing:.14em;color:var(--accent);margin:0 0 4px}
.gate p{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.gate .foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.loading{flex:1;display:grid;place-items:center;color:var(--muted2);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.loading .dot{background:var(--accent);animation:pulse .9s infinite;margin-right:8px}


/* ==== 30-semana.css ==== */
/* SEMANA: barra de semana, telemetría viva, cola de tareas y hueco del calendario. */
.semana{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.sem-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sem-meta{display:flex;flex-direction:column;gap:1px}
.sem-range{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.sem-actions{margin-left:auto}
.sem-live .metric .v{font-size:15px}

.sem-body{flex:1;min-height:0;display:flex;gap:12px}
.sem-tasks{width:360px;flex:none;display:flex;flex-direction:column;min-height:0}
.sem-tasks-head{padding:14px 14px 10px}
.sem-tasks-head .section-title{margin-top:3px}
.sem-tasks-head .tiny{margin-top:4px}
.sem-tasks-scroll{flex:1;min-height:0;overflow:auto;padding:0 12px 12px}

.area-head{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.area-name{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.07em}
.area-meta{font-family:var(--mono);font-size:10px;color:var(--muted2);white-space:nowrap}
.area-add{margin-left:auto;width:26px;height:24px;border-radius:4px;background:var(--panel2);
  font-family:var(--mono);font-weight:700;font-size:14px;line-height:1;flex:none}
.area-add:hover{background:var(--panel3)}
.area-empty{font-size:12px;color:var(--muted2);padding:2px 4px 6px}

.tarea{display:flex;align-items:stretch;background:var(--panel2);border:1px solid var(--grid);
  border-radius:var(--radius);margin:4px 0;padding-left:3px;cursor:default}
.tarea-main{flex:1;min-width:0;padding:8px 6px 8px 10px;cursor:pointer}
.tarea-name{font-size:13px;font-weight:700;line-height:1.25;word-break:break-word}
.tarea-tele{font-family:var(--mono);font-size:10px;font-weight:700;margin-top:3px;letter-spacing:.03em}
.tarea-note{font-size:11.5px;color:var(--muted2);margin-top:3px;line-height:1.3}
.tarea-ctl{align-self:center;display:flex;border:1px solid var(--grid);background:var(--grid);gap:1px;
  border-radius:4px;overflow:hidden;margin:0 8px 0 4px;flex:none}
.tarea-ctl button{width:31px;height:28px;background:var(--panel2);font-family:var(--mono);
  font-size:14px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.tarea-ctl button:hover{background:var(--panel3);color:var(--text)}
.sem-foot{font-family:var(--mono);font-size:10px;color:var(--muted2);padding:12px 2px 4px;
  border-top:1px solid var(--grid);margin-top:14px}

.sem-cal{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sem-cal-placeholder{flex:1;display:grid;place-items:center;text-align:center;padding:24px}

/* diálogo de tarea */
.t-form .textarea{min-height:150px}

/* menú ⋯ de tarea */
.menu-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grid);
  border:1px solid var(--grid);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.menu-cells .cell{background:var(--panel2);padding:8px 10px}
.menu-cells .k{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.menu-cells .v{font-size:13px;font-weight:700;margin-top:2px}
.menu-note{font-size:12.5px;white-space:pre-line;margin:3px 0 12px;line-height:1.4}
.menu-log{background:var(--panel2);border:1px solid var(--grid);border-radius:var(--radius);padding:4px 9px;margin-top:4px}
.menu-log .l{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-family:var(--mono);font-size:11px}
.menu-log .d{font-weight:700;width:34px;flex:none}
.menu-log .t{width:98px;flex:none}
.menu-log .dur{color:var(--muted)}
.menu-log .more{font-family:var(--mono);font-size:10px;color:var(--muted2);padding:2px 0 5px}
.menu-empty{font-size:12px;color:var(--muted2);margin:2px 0 6px}

/* cierre de semana */
.cw-info{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:6px}
.cw-info .sum{color:var(--muted2);white-space:nowrap}
.cw-area{display:flex;align-items:center;gap:8px;padding:10px 0 3px}
.cw-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--grid);
  border-radius:var(--radius);margin:3px 0;padding:8px 10px 8px 12px}
.cw-main{flex:1;min-width:0}
.cw-sel{width:190px;flex:none}
.cw-sel.bad{border-color:var(--danger)}
@media(max-width:759px){
  .cw-row{flex-wrap:wrap}
  .cw-sel{width:100%}
}

/* móvil: segmentado tareas / calendario */
.sem-seg{display:none}
@media(max-width:759px){
  .semana{padding:10px 12px;gap:8px}
  .sem-actions{margin-left:0;width:100%}
  .sem-seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--grid);border-radius:var(--radius);padding:3px}

<script>
/* Constantes de build. BACKEND_URL_DEFAULT viene de backend/config.json (puede estar vacia). */
const BUILD = "2026-09-14 02:01";
const BACKEND_URL_DEFAULT = "";
/* ==== 10-util.js ==== */
/* U — utilidades puras. COMPARTIDO con el backend (Apps Script): nada de DOM ni de window aquí.
   Puerto de las funciones de modulo de Weeklog (app.py 118-216). */
var U = (function () {
  var DAY_NAMES = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
  var DAY_NAMES_LONG = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  var MONTH_NAMES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
    "septiembre", "octubre", "noviembre", "diciembre"];
  var MONTH_SHORT = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  function pad2(n) { n = Math.floor(n); return (n < 10 ? "0" : "") + n; }

  /* "HH:MM" -> minutos desde 00:00. Acepta "H:MM" y "HH.MM". Lanza Error si no es válida. */
  function parseClock(value) {
    var s = String(value == null ? "" : value).trim().replace(".", ":");
    var m = /^(\d{1,2}):(\d{2})$/.exec(s);
    if (!m) throw new Error("Hora no válida: usa HH:MM");
    var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
    if (h > 23 || mi > 59) throw new Error("Hora fuera de rango: " + s);
    return h * 60 + mi;
  }

  /* Minutos desde la hora de inicio del calendario. Una hora anterior a startHour se
     interpreta como madrugada del día siguiente (07:00 -> 0, 01:30 -> 18h30 = 1110). */
  function calendarMinute(value, startHour) {
    var sh = (startHour == null ? 7 : startHour) * 60;
    var m = parseClock(value);
    if (m < sh) m += 24 * 60;
    return m - sh;
  }

  /* Duración de una noche: bed -> wake, siempre hacia delante; máximo 16 h. */
  function sleepDurationMinutes(bed, wake) {
    var b = parseClock(bed), w = parseClock(wake);
    var d = w - b;
    if (d <= 0) d += 24 * 60;
    if (d > 16 * 60) throw new Error("Más de 16 h de sueño: revisa las horas");
    return d;
  }

  function formatDuration(minutes) {
    if (minutes == null || isNaN(minutes)) return "—";
    var m = Math.round(minutes);
    if (m <= 0) return "0m";
    var h = Math.floor(m / 60), r = m % 60;
    if (h && r) return h + "h " + pad2(r) + "m";
    if (h) return h + "h";
    return r + "m";
  }

  function formatHours(minutes) {
    if (minutes == null || isNaN(minutes)) return "—";
    return (Math.round(minutes / 6) / 10).toFixed(1) + " h";
  }

  /* Media circular de horas de reloj ("23:30", "01:00" -> "00:15"). */
  function averageClock(times) {
    var xs = 0, ys = 0, n = 0;
    for (var i = 0; i < times.length; i++) {
      var m;
      try { m = parseClock(times[i]); } catch (e) { continue; }
      var a = (m / (24 * 60)) * 2 * Math.PI;
      xs += Math.cos(a); ys += Math.sin(a); n++;
    }
    if (!n) return "—";
    var ang = Math.atan2(ys / n, xs / n);
    if (ang < 0) ang += 2 * Math.PI;
    var mins = Math.round((ang / (2 * Math.PI)) * 24 * 60) % (24 * 60);
    return pad2(Math.floor(mins / 60)) + ":" + pad2(mins % 60);
  }

  function intervalsUnionMinutes(intervals) {
    var xs = intervals.filter(function (iv) { return iv && iv[1] > iv[0]; })
      .map(function (iv) { return [iv[0], iv[1]]; })
      .sort(function (a, b) { return a[0] - b[0]; });
    var total = 0, cur = null;
    for (var i = 0; i < xs.length; i++) {
      if (!cur) { cur = xs[i]; continue; }
      if (xs[i][0] <= cur[1]) { if (xs[i][1] > cur[1]) cur[1] = xs[i][1]; }
      else { total += cur[1] - cur[0]; cur = xs[i]; }
    }
    if (cur) total += cur[1] - cur[0];
    return total;
  }

  /* fechas locales (sin zona): Date <-> "YYYY-MM-DD" */
  function isoDate(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseIso(s) {

/* API — la frontera con el backend (docs/contrato-api.md). Dos transportes:
   "apps": POST text/plain al Web App de Apps Script, con clave y reintentos idempotentes.
   "mock": implementación en memoria + localStorage (14-mock.js) para desarrollo y pruebas. */
var API = (function () {
  var cfg = { transport: "apps", backendUrl: "", key: "" };

  function ApiError(msg) { this.name = "ApiError"; this.message = msg; }
  ApiError.prototype = Object.create(Error.prototype);
  function TransportError(msg) { this.name = "TransportError"; this.message = msg; }
  TransportError.prototype = Object.create(Error.prototype);

  function configure(o) { Object.keys(o || {}).forEach(function (k) { cfg[k] = o[k]; }); }
  function config() { return { transport: cfg.transport, backendUrl: cfg.backendUrl, key: cfg.key }; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function parse(txt) {
    var j = null;
    try { j = JSON.parse(txt); } catch (_) { }
    if (!j || typeof j !== "object") throw new TransportError("respuesta no válida del backend");
    if (j.ok !== true) throw new ApiError(j.error || "error del backend");
    return j.data;
  }

  async function post(action, args, write) {
    if (cfg.transport === "mock") return Mock.call(action, args || {});
    if (!cfg.backendUrl) throw new ApiError("Falta la URL del backend");
    var body = Object.assign({ action: action, key: cfg.key }, args || {});
    if (write) body.req_id = U.uuid();
    var lastErr = null;
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var r = await fetch(cfg.backendUrl, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body), cache: "no-store", redirect: "follow"
        });
        return parse(await r.text());
      } catch (e) {
        if (e instanceof ApiError) throw e;
        lastErr = e;
        await sleep(400 * (attempt + 1));
      }
    }
    throw new TransportError("No hay respuesta del backend" + (lastErr && lastErr.message ? " (" + lastErr.message + ")" : ""));
  }

  async function ping() {
    if (cfg.transport === "mock") return Mock.call("ping", {});
    if (!cfg.backendUrl) throw new ApiError("Falta la URL del backend");
    var sep = cfg.backendUrl.indexOf("?") >= 0 ? "&" : "?";
    var r = await fetch(cfg.backendUrl + sep + "action=ping", { cache: "no-store", redirect: "follow" });
    return parse(await r.text());
  }

  return {
    ApiError: ApiError, TransportError: TransportError, configure: configure, config: config,
    ping: ping,
    bootstrap: function () { return post("bootstrap", {}); },
    getWeek: function (weekKey) { return post("getWeek", { week_key: weekKey }); },
    addTask: function (weekKey, area, name, notes) { return post("addTask", { week_key: weekKey, area: area, name: name, notes: notes }, true); },
    updateTask: function (weekKey, id, name, notes) { return post("updateTask", { week_key: weekKey, id: id, name: name, notes: notes }, true); },
    deleteTask: function (weekKey, id) { return post("deleteTask", { week_key: weekKey, id: id }, true); },
    addSession: function (weekKey, taskId, day, start, end) { return post("addSession", { week_key: weekKey, task_id: taskId, day: day, start: start, end: end }, true); },
    updateSession: function (weekKey, id, changes) { return post("updateSession", Object.assign({ week_key: weekKey, id: id }, changes || {}), true); },
    deleteSession: function (weekKey, id) { return post("deleteSession", { week_key: weekKey, id: id }, true); },
    setSleep: function (weekKey, sleep) { return post("setSleep", { week_key: weekKey, sleep: sleep }, true); },
    closeWeek: function (weekKey, outcomes) { return post("closeWeek", { week_key: weekKey, outcomes: outcomes }, true); },
    saveSettings: function (settings) { return post("saveSettings", { settings: settings }, true); },
    listCalendars: function () { return post("listCalendars", {}); },
    backup: function (reason) { return post("backup", { reason: reason || "manual" }, true); },
    exportAll: function () { return post("exportAll", {}); },
    importAll: function (data) { return post("importAll", { data: data }, true); },
    clearHistory: function () { return post("clearHistory", {}, true); },
    resetAll: function () { return post("resetAll", {}, true); }
  };
})();

/* S — estado global de la app. Todo lo que se pinta sale de aquí. */
var S = {
  ready: false,
  error: null,
  settings: null,
  meta: null,
  week: null,        // semana activa (con sessions y context)
  weeks: {},         // caché: key -> semana completa (cerradas con su copia congelada)
  index: {},         // key -> {start_date, closed_at, stats, finished[]} de las cerradas
  calendars: [],
  ui: {
    screen: "semana",       // semana | historial | ajustes
    calView: "week",        // week | day
    day: 0,                 // día seleccionado en vista día
    mobileTab: "tareas",    // tareas | calendario (solo móvil)
    histKey: null,          // semana seleccionada en historial
    histTab: "semana",      // semana | mes | tendencias
    month: null,            // "YYYY-MM" en la vista mes
    busy: 0,
    lastError: null
  },

  areas: function () { return (S.settings && S.settings.areas) || []; },
  area: function (id) { return U.areaById(S.settings, id); },
  areaColor: function (id) { var a = S.area(id); return a ? a.color : "#59d3df"; },
  areaFill: function (id) { var a = S.area(id); return a ? a.fill : "#1d2a35"; },
  areaShort: function (id) { var a = S.area(id); return a ? a.short : "LOG"; },
  areaName: function (id) { var a = S.area(id); return a ? a.name : String(id || "").toUpperCase(); },
  startHour: function () { return S.settings ? S.settings.cal_start_hour : 7; },
  endHour: function () { return S.settings ? S.settings.cal_end_hour : 26; },
  weekKey: function () { return S.week ? S.week.start_date : null; },

  /* índice 0..6 de hoy dentro de la semana activa, o -1 si hoy no cae en ella */
  todayDay: function () {
    if (!S.week) return -1;
    var d = U.daysBetween(S.week.start_date, U.todayIso());
    return d >= 0 && d < 7 ? d : -1;
  },

  task: function (id) { return S.week ? Dominio.findTask(S.week, id) : null; },
  closedKeys: function () { return Object.keys(S.index).sort().reverse(); },

  /* carga inicial (bootstrap) */
  load: async function () {
    S.ready = false; S.error = null;
    var data = await API.bootstrap();
    S.applyBootstrap(data);
    S.ready = true;
  },
  applyBootstrap: function (data) {
    S.settings = Dominio.normaliseSettings(data.settings);
    S.meta = data.meta || { active_week: null, closed_keys: [] };
    S.week = Dominio.normaliseWeek(data.week);
    Dominio.syncAllStates(S.week);
    S.index = data.index || {};
    S.calendars = data.calendars || [];
    // La caché de semanas se vacía en cada bootstrap: tras importar, borrar historial o
    // reiniciar, una semana cacheada con la misma clave sería un dato viejo.
    S.weeks = {};
    if (S.week) S.weeks[S.week.start_date] = S.week;
    var t = S.todayDay();
    S.ui.day = t >= 0 ? t : 0;
    if (!S.ui.month) S.ui.month = U.todayIso().slice(0, 7);
    if (!S.ui.histKey) S.ui.histKey = S.closedKeys()[0] || null;
  },

  /* recarga solo la semana activa (p. ej. para ver cambios hechos en Google Calendar) */
  reloadWeek: async function () {
    var data = await API.getWeek(S.weekKey());
    S.week = Dominio.normaliseWeek(data.week);
    Dominio.syncAllStates(S.week);
    S.weeks[S.week.start_date] = S.week;
  },

  /* semana del historial (con caché) */
  loadWeek: async function (key) {
    if (S.weeks[key] && S.weeks[key].closed) return S.weeks[key];
    var data = await API.getWeek(key);
    var w = Dominio.normaliseWeek(data.week);
    S.weeks[key] = w;
    return w;
  },

  /* Mutación optimista: aplica en S, pinta, llama al backend; si falla, revierte y avisa.
     opts: {apply(), request() -> Promise, after(data), snapshot() -> any, restore(snap)} */
  act: async function (opts) {
    var snap = opts.snapshot ? opts.snapshot() : U.deepClone(S.week);
    try {
      if (opts.apply) opts.apply();
      S.ui.busy++;
      Shell.render();
      var data = await opts.request();
      if (opts.after) opts.after(data);
      S.ui.lastError = null;
      return data;
    } catch (e) {
      if (opts.restore) opts.restore(snap); else S.week = snap;
      if (S.week) S.weeks[S.week.start_date] = S.week;
      S.ui.lastError = e && e.message ? e.message : String(e);
      Shell.toast(S.ui.lastError, "bad");
      return null;
    } finally {
      S.ui.busy = Math.max(0, S.ui.busy - 1);
      Shell.render();
    }
  }
};

/* Shell — cabecera, navegación, render maestro, modales, confirmaciones y toasts. */
var Shell = (function () {
  var SCREENS = [
    { id: "semana", label: "SEMANA", ico: "▦" },
    { id: "historial", label: "HISTORIAL", ico: "≣" },
    { id: "ajustes", label: "AJUSTES", ico: "⚙" }
  ];

    if (q.get("mock") === "1") lsSet(LS_MODE, "mock");

  }

  async function boot() {
    var c = readConfig();
    if (c.mock) API.configure({ transport: "mock", backendUrl: "", key: "" });
    else API.configure({ transport: "apps", backendUrl: c.url, key: c.key });
    bindGlobal();
    if (!c.mock && (!c.url || !c.key)) { mode = "gate"; render(); return; }
    await start();
  }

  async function start() {
    mode = "loading"; render();
    try {
      await S.load();
      mode = "app";
      // Parámetros de desarrollo para abrir directamente una pantalla (capturas headless):
      //   ?pantalla=historial&hist=mes&mes=2026-09   ?vista=day&dia=2   ?tab=calendario
      var q = new URLSearchParams(location.search);
      if (q.get("pantalla")) S.ui.screen = q.get("pantalla");
      if (q.get("vista")) S.ui.calView = q.get("vista");
      if (q.get("dia")) S.ui.day = U.clamp(parseInt(q.get("dia"), 10) || 0, 0, 6);
      if (q.get("hist")) S.ui.histTab = q.get("hist");
      if (q.get("mes")) S.ui.month = q.get("mes");
      if (q.get("tab")) S.ui.mobileTab = q.get("tab");
      if (q.get("abrir")) setTimeout(function () { abrirDeDesarrollo(q.get("abrir")); }, 120);
    } catch (e) {
      S.error = e && e.message ? e.message : String(e);
      mode = "gate";
      toast(S.error, "bad");
    }
    render();
  }

  /* ?abrir=tarea|editar|menu|sesion|editar-sesion|sueno|cerrar|picker|daylog — abre un diálogo
     al cargar, para capturas de pantalla sin cabeza. Solo desarrollo. */
  function abrirDeDesarrollo(que) {
    try {
      var t = (S.week.tasks || []).filter(function (x) { return !x.fixed; })[0] || S.week.tasks[0];
      var s = (S.week.sessions || [])[0];
      if (que === "tarea") Semana.openTaskDialog(S.areas()[0].id, null);
      else if (que === "editar") Semana.openTaskDialog(t.area, t.id);
      else if (que === "menu") Semana.openTaskMenu(t.id);
      else if (que === "sesion") Cal.openSessionDialog({ task_id: t.id, day: 0, start: "10:00", end: "11:00" });
      else if (que === "editar-sesion" && s) Cal.openSessionDialog({ session_id: s.id });
      else if (que === "sueno") Cal.openSleepDialog(0);
      else if (que === "cerrar") Semana.openCloseWeek();

      '<nav>' + nav + '</nav>' +
      '<div class="status">' + mockChip +

  }

    return '<nav class="bottomnav">' + SCREENS.map(function (s) {
      return '<button data-go="' + s.id + '" class="' + (S.ui.screen === s.id ? "on" : "") + '"><span class="ico">' + s.ico + '</span>' + s.label + '</button>';

  function gateHtml() {
