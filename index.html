/* ==== 40-calendario.js ==== */
/* Cal — calendario semana/día (puerto de app.py 1601-2098). Rejilla DOM, no canvas.
   Pinta S.week.context (eventos de Google, solo lectura), S.week.sessions (bloques del área)
   y el sueño en la cabecera de cada día. Diálogos: sesión, selector de tarea y sueño.
   La barra superior (VISTA / SUEÑO / CERRAR SEMANA) la pinta Semana; aquí solo la rejilla. */
var Cal = (function () {
  var HOUR_H = 58, HEAD_H = 68;
  var STATUS_DEFAULT = "Selecciona una tarea con + para registrar una sesión.";
  var scrollTop = 30;                     // ~07:30; se conserva entre renders

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function sh() { return S.startHour(); }
  function totalMinutes() { return (S.endHour() - S.startHour()) * 60; }
  function safeMin(clock) { try { return U.calendarMinute(clock, sh()); } catch (e) { return null; } }
  function visibleDays() { return S.ui.calView === "day" ? [U.clamp(S.ui.day | 0, 0, 6)] : [0, 1, 2, 3, 4, 5, 6]; }
  function findSession(id) { return (S.week.sessions || []).filter(function (s) { return s.id === id; })[0] || null; }
  function taskOf(s) { return s && s.task_id ? Dominio.findTask(S.week, s.task_id) : null; }
  function durationOf(s) { var a = safeMin(s.start), b = safeMin(s.end); return (a == null || b == null) ? null : b - a; }
  function rangeText() { return U.pad2(sh()) + ":00–" + U.pad2(S.endHour() % 24) + ":00"; }
  function dateOf(day) { return U.parseIso(U.isoAddDays(S.week.start_date, day)); }
  /* Repinta el calendario. Si el host vive dentro de la app (#app) hay que repintar todo
     (la telemetría de SEMANA depende de las sesiones); si es un host suelto (pruebas), solo él. */
  function rerender(host) {
    if (host && host.closest && !host.closest("#app")) render(host);
    else if (document.getElementById("app")) Shell.render();
    else if (host) render(host);
  }

  function sleepText(day) {
    var rec = (S.week.sleep || {})[String(day)];
    if (!rec) return "SLEEP —";
    try { return "SLEEP " + rec.bed + "→" + rec.wake + " · " + U.formatDuration(U.sleepDurationMinutes(rec.bed, rec.wake)); }
    catch (e) { return "SLEEP —"; }
  }
  function statusText(s) {
    var t = taskOf(s), d = durationOf(s);
    var parts = t ? [S.areaName(t.area), t.name] : ["SIN TAREA", s.title || "bloque sin tarea"];
    parts.push(s.start + "–" + s.end, U.formatDuration(d));
    if (t && t.notes) parts.push(String(t.notes).replace(/\s+/g, " ").trim());
    return parts.join("  ·  ");
  }

  /* ---------- render ---------- */
  function render(host) {
    if (!host) return;
    var week = S.week;
    if (!week) { host.innerHTML = '<div class="empty">Sin semana activa.</div>'; return; }
    if (Shell.isMobile() && !S.ui.calViewTouched && S.ui.calView !== "day") S.ui.calView = "day";
    var days = visibleDays(), n = days.length, total = totalMinutes(), bodyH = Math.round(total / 60 * HOUR_H);
    var cols = "var(--time-gutter) repeat(" + n + ", minmax(" + (n === 1 ? 260 : 105) + "px, 1fr))";
    var h = '<div class="cal' + (n === 1 ? " day" : "") + '">';
    if (S.ui.calView === "day") h += railHtml();
    h += '<div class="cal-hint"><span class="accent">FLIGHT LOG</span><span class="muted">  ·  actividad real  ·  clic = editar  ·  sueño en cabecera = editar</span></div>';
    h += '<div class="cal-scroll"><div class="cal-grid" style="grid-template-columns:' + cols + '">';
    h += '<div class="cal-gh"><span>LOCAL</span><span class="accent">LOG</span></div>';
    days.forEach(function (d) { h += dayHeadHtml(d); });
    var allday = (week.context || []).filter(function (e) { return e.all_day && days.indexOf(e.day) >= 0; });
    if (allday.length) {
      h += '<div class="cal-ag"></div>';
      days.forEach(function (d) {
        h += '<div class="cal-ac">' + allday.filter(function (e) { return e.day === d; }).map(chipHtml).join("") + '</div>';
      });
    }
    h += gutterHtml(total, bodyH);
    days.forEach(function (d) { h += columnHtml(d, total, bodyH); });
    h += '</div></div>';
    h += '<div class="cal-status" id="cal-status">' + U.esc(STATUS_DEFAULT) + '</div></div>';
    host.innerHTML = h;
    bind(host);
    var sc = $(".cal-scroll", host);
    if (sc) { sc.scrollTop = scrollTop; sc.addEventListener("scroll", function () { scrollTop = sc.scrollTop; }); }
  }

  function railHtml() {
    var h = '<div class="cal-rail">';
    for (var d = 0; d < 7; d++) {
      var dt = dateOf(d);
      h += '<button type="button" class="btn compact mono' + (d === S.ui.day ? " active" : "") + (d >= 5 ? " wk" : "") + '" data-rail="' + d + '">' +
        U.DAY_NAMES[d].toUpperCase() + " " + U.pad2(dt.getDate()) + '</button>';
    }
    return h + '</div>';
  }
  function dayHeadHtml(d) {
    var dt = dateOf(d), rec = (S.week.sleep || {})[String(d)];
    return '<div class="cal-dh' + (d === S.todayDay() ? " today" : "") + '" data-day="' + d + '">' +
      '<div class="cal-dh-date">' + U.DAY_NAMES[d].toUpperCase() + "  " + U.pad2(dt.getDate()) + "/" + U.pad2(dt.getMonth() + 1) + '</div>' +
      '<button type="button" class="cal-sleep' + (rec ? " on" : "") + '" data-sleep="' + d + '" title="Editar el sueño de la semana">' + U.esc(sleepText(d)) + '</button></div>';
  }
  function chipHtml(e) {
    return '<span class="cal-chip gcol-' + (e.color_id || 0) + '" title="' + U.esc(e.title) + ' · todo el día">' + U.esc(e.title) + '</span>';
  }
  function gutterHtml(total, bodyH) {
    var h = '<div class="cal-gutter" style="height:' + bodyH + 'px">';
    for (var hr = sh(); hr <= S.endHour(); hr++) {
      var y = Math.round((hr - sh()) * HOUR_H);
      h += '<span class="cal-hl" style="top:' + y + 'px">' + U.pad2(hr % 24) + ':00</span>';
    }
    return h + '</div>';
  }
  function columnHtml(d, total, bodyH) {
    var h = '<div class="cal-col" data-col="' + d + '" style="height:' + bodyH + 'px">';
    (S.week.context || []).forEach(function (e) {
      if (e.all_day || e.day !== d) return;
      var a = safeMin(e.start), b = safeMin(e.end);
      if (a == null || b == null || b <= a || a >= total) return;
      b = Math.min(b, total);
      h += '<div class="cal-ev gcol-' + (e.color_id || 0) + '" style="top:' + px(a) + 'px;height:' + Math.max(14, px(b) - px(a)) + 'px" title="' +
        U.esc(e.title) + ' · ' + U.esc(e.start) + '–' + U.esc(e.end) + (e.location ? ' · ' + U.esc(e.location) : "") + '">' + U.esc(e.title) + '</div>';
    });
    var sessions = (S.week.sessions || []).filter(function (s) { return s.day === d; })
      .sort(function (x, y) { return (safeMin(x.start) || 0) - (safeMin(y.start) || 0); });
    sessions.forEach(function (s) {
      var a = safeMin(s.start), b = safeMin(s.end);
      if (a == null || b == null || b <= a || a >= total) return;
      b = Math.min(b, total);
      var height = Math.max(14, px(b) - px(a));
      var t = taskOf(s), dur = U.formatDuration(b - a);
      var style = 'top:' + px(a) + 'px;height:' + height + 'px';
      var l1, l2 = "", cls = "cal-se";
      if (t) {
        style += ';--se-fill:' + S.areaFill(t.area) + ';--se-edge:' + S.areaColor(t.area);
        if (height >= 45) { l1 = S.areaShort(t.area) + "  ·  " + s.start + "–" + s.end + "  ·  " + dur; l2 = t.name; }
        else l1 = S.areaShort(t.area) + " · " + s.start + "–" + s.end + "  " + t.name;
      } else {
        cls += " none";
        l1 = "SIN TAREA · " + (s.title || s.start + "–" + s.end);
        if (height >= 45) { l1 = "SIN TAREA  ·  " + s.start + "–" + s.end + "  ·  " + dur; l2 = s.title || "asignar tarea"; }
      }
      h += '<div class="' + cls + '" data-sid="' + U.esc(s.id) + '" style="' + style + '" title="' + U.esc(statusText(s)) + '">' +
        '<div class="l1">' + U.esc(l1) + '</div>' + (l2 ? '<div class="l2">' + U.esc(l2) + '</div>' : "") + '</div>';
    });
    // línea de «ahora»: la madrugada pertenece al día anterior
    var today = S.todayDay();
    if (today >= 0) {
      var nowMin = U.parseClock(U.nowClock()), nowDay = today;
      if (nowMin < sh() * 60) nowDay -= 1;
      var nm = safeMin(U.nowClock());
      if (nowDay === d && nm != null && nm < total) h += '<div class="cal-now" style="top:' + px(nm) + 'px"></div>';
    }
    return h + '</div>';
  }
  function px(min) { return Math.round(min / 60 * HOUR_H); }

  function bind(host) {
    $$("[data-rail]", host).forEach(function (b) {
      // Cambiar de día solo afecta a la rejilla: se repinta el host directamente (más barato y
      // conserva el scroll) en vez de toda la app.
      b.addEventListener("click", function () { S.ui.day = parseInt(b.getAttribute("data-rail"), 10); S.ui.dayTouched = true; render(host); });
    });
    $$("[data-sleep]", host).forEach(function (b) {
      b.addEventListener("click", function (e) { e.stopPropagation(); openSleepDialog(parseInt(b.getAttribute("data-sleep"), 10)); });
    });
    var status = $("#cal-status", host);
    $$(".cal-se", host).forEach(function (el) {
      var s = findSession(el.getAttribute("data-sid"));
      el.addEventListener("click", function (e) { e.stopPropagation(); if (s) openSessionDialog({ session_id: s.id }); });
      el.addEventListener("mouseenter", function () { if (status && s) status.textContent = statusText(s); });
      el.addEventListener("mouseleave", function () { if (status) status.textContent = STATUS_DEFAULT; });
    });
    $$(".cal-col", host).forEach(function (col) {
      col.addEventListener("click", function (e) {
        if (e.target !== col) return;
        var y = e.clientY - col.getBoundingClientRect().top;
        var m = U.clamp(U.roundTo(y / HOUR_H * 60, 15), 0, totalMinutes() - 15);
        var abs = sh() * 60 + m, end = Math.min(abs + 60, S.endHour() * 60);
        openSessionDialog({ day: parseInt(col.getAttribute("data-col"), 10), start: U.minutesToClock(abs), end: U.minutesToClock(end) });
      });
    });
  }

  function toggleView() {
    S.ui.calView = S.ui.calView === "day" ? "week" : "day";
    S.ui.calViewTouched = true;
    if (S.ui.calView === "day" && S.todayDay() >= 0 && !S.ui.dayTouched) S.ui.day = S.todayDay();
    Shell.render();
  }

  /* ---------- selector de tarea ---------- */
  function openTaskPicker(selectedId, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) { if (done) return; done = true; resolve(v); }
      var tasks = S.week.tasks || [];
      var h = '<div class="tp">';
      if (opts.allowNone) h += '<label class="tp-row none"><input type="radio" name="tp" value=""' + (selectedId == null ? " checked" : "") + '><span class="tp-name muted">Sin tarea</span></label>';
      S.areas().forEach(function (a) {
        var ts = tasks.filter(function (t) { return t.area === a.id; });
        if (!ts.length) return;
        h += '<div class="tp-area" style="color:' + a.color + '">' + U.esc(a.name) + '</div>';
        ts.forEach(function (t) {
          var mins = Dominio.sessionMinutes(S.week, t.id, S.settings), n = Dominio.sessionCount(S.week, t.id);
          h += '<label class="tp-row"><input type="radio" name="tp" value="' + U.esc(t.id) + '"' + (t.id === selectedId ? " checked" : "") + '>' +
            '<span class="tp-rail" style="background:' + a.color + '"></span>' +
            '<span class="tp-name">' + (t.carried ? "*  " : "") + U.esc(t.name) + '</span>' +
            '<span class="tiny">' + (n ? "EN CURSO · " + U.formatDuration(mins) + " · " + n + " ses." : "SIN EMPEZAR") + '</span></label>';
        });
      });
      if (!tasks.length) h += '<div class="empty">No hay tareas en esta semana.</div>';
      h += '</div>';
      var handle = Shell.modal({
        kicker: "SELECT TASK", kickerAccent: true, title: "Tarea de la actividad", width: 480, html: h,
        footer: [
          { label: "Cancelar", kind: "secondary", onClick: function (hd) { hd.close(); } },
          { label: "Elegir", kind: "primary", onClick: function (hd) {
            var r = $("input[name=tp]:checked", hd.el);
            if (!r) { Shell.toast("Elige una tarea.", "warn"); return; }
            finish(r.value === "" ? null : r.value); hd.close();
          } }
        ],
        onOpen: function (hd) {
          $$(".tp-row", hd.el).forEach(function (row) {
            row.addEventListener("dblclick", function () { var r = $("input", row); if (r) { finish(r.value === "" ? null : r.value); hd.close(); } });
          });
        },
        onClose: function () { finish(undefined); },
        noFocus: true
      });
      var checked = $("input[name=tp]:checked", handle.el) || $("input[name=tp]", handle.el);
      if (checked) setTimeout(function () { try { checked.focus(); } catch (e) { } }, 30);
    });
  }

  /* ---------- diálogo de sesión ---------- */
  function openSessionDialog(opts) {
    opts = opts || {};
    var week = S.week; if (!week) return;
    var session = opts.session_id ? findSession(opts.session_id) : null;
    if (opts.session_id && !session) { Shell.toast("Esa sesión ya no está en la semana.", "warn"); return; }
    var tasks = week.tasks || [];
    if (!session && !tasks.length) { Shell.toast("Primero añade una tarea.", "warn"); return; }
    var sel = { id: session ? (taskOf(session) ? session.task_id : null) : (opts.task_id || null) };
    var day = session ? session.day : (opts.day != null ? opts.day : (S.ui.calView === "day" ? S.ui.day : (S.todayDay() >= 0 ? S.todayDay() : 0)));
    var start = session ? session.start : (opts.start || ""), end = session ? session.end : (opts.end || "");
    var rail = sel.id ? S.areaColor(Dominio.findTask(week, sel.id).area) : null;

    var h = '<div class="fields c3">' +
      '<div><label class="label" for="sd-day">Día</label><select class="select mono" id="sd-day">' +
      U.DAY_NAMES_LONG.map(function (nm, i) { return '<option value="' + i + '"' + (i === day ? " selected" : "") + '>' + nm + '</option>'; }).join("") + '</select></div>' +
      '<div><label class="label" for="sd-start">Inicio</label><input class="input mono" id="sd-start" placeholder="HH:MM" autocomplete="off" value="' + U.esc(start) + '"></div>' +
      '<div><label class="label" for="sd-end">Fin</label><input class="input mono" id="sd-end" placeholder="HH:MM" autocomplete="off" value="' + U.esc(end) + '"></div></div>' +
      '<div class="field" style="margin-top:12px"><label class="label">Tarea</label><button type="button" class="sd-task" id="sd-task"></button></div>' +
      '<div class="row between sd-hint"><span class="tiny">Horas exactas · ' + rangeText() + ' · los eventos de contexto sí pueden solaparse</span><span class="tiny accent" id="sd-dur">DURACIÓN —</span></div>';

    var footer = [];
    if (session) footer.push({ label: "Quitar del horario", kind: "danger", left: true, onClick: function (hd) { removeSession(session, hd); } });
    footer.push({ label: "Cancelar", kind: "secondary", onClick: function (hd) { hd.close(); } });
    footer.push({ label: "Guardar", kind: "primary", onClick: function (hd) { save(hd); } });

    var handle = Shell.modal({
      kicker: session ? "EDIT ACTIVITY" : "LOG ACTIVITY", kickerAccent: true, rail: rail || undefined,
      title: session ? "Editar bloque del horario" : "Añadir una sesión al registro semanal",
      width: 560, html: h, footer: footer, hint: "ENTER  guardar",
      onOpen: function (hd) {
        syncTaskLabel(hd);
        ["#sd-start", "#sd-end"].forEach(function (id) { $(id, hd.el).addEventListener("input", function () { updateDuration(hd); }); });
        updateDuration(hd);
        $("#sd-task", hd.el).addEventListener("click", function () {
          openTaskPicker(sel.id, { allowNone: !!session }).then(function (r) {
            if (r === undefined) return;
            sel.id = r; syncTaskLabel(hd);
          });
        });
      }
    });

    function syncTaskLabel(hd) {
      var b = $("#sd-task", hd.el), t = sel.id ? Dominio.findTask(week, sel.id) : null;
      if (t) b.innerHTML = '<span class="tp-rail" style="background:' + S.areaColor(t.area) + '"></span><span style="color:' + S.areaColor(t.area) + '">' + U.esc(S.areaName(t.area)) + '</span><span class="muted2">  ·  </span>' + (t.carried ? "*  " : "") + U.esc(t.name);
      else b.innerHTML = '<span class="muted">' + (session ? "Sin tarea  ·  elegir…" : "Seleccionar…") + '</span>';
    }
    function updateDuration(hd) {
      var a = safeMin($("#sd-start", hd.el).value), b = safeMin($("#sd-end", hd.el).value);
      $("#sd-dur", hd.el).textContent = (a != null && b != null && b > a) ? "DURACIÓN " + U.formatDuration(b - a) : "DURACIÓN —";
    }
    function save(hd) {
      var dayV = parseInt($("#sd-day", hd.el).value, 10);
      var sV = $("#sd-start", hd.el).value.trim(), eV = $("#sd-end", hd.el).value.trim();
      var sMin, eMin;
      try { sMin = U.calendarMinute(sV, sh()); eMin = U.calendarMinute(eV, sh()); }
      catch (e) { Shell.toast(e.message, "bad"); return; }
      if (eMin <= sMin) { Shell.toast("La hora final debe ser posterior a la inicial", "bad"); return; }
      if (eMin > totalMinutes()) { Shell.toast("Fuera del rango del calendario (" + rangeText() + ")", "bad"); return; }
      if (!session && !sel.id) { Shell.toast("Selecciona una tarea.", "bad"); return; }
      var choque = (week.sessions || []).some(function (o) {
        if (session && o.id === session.id) return false;
        if (o.day !== dayV) return false;
        var a = safeMin(o.start), b = safeMin(o.end);
        return a != null && b != null && Math.max(sMin, a) < Math.min(eMin, b);
      });
      if (choque) { Shell.toast("Esta actividad se solapa con otra actividad registrada.", "bad"); return; }
      var t = sel.id ? Dominio.findTask(week, sel.id) : null;
      var title = t ? t.name : (session ? session.title : "");
      var key = S.weekKey();
      hd.close();
      if (session) {
        var sid = session.id, oldTask = session.task_id, newTask = sel.id;
        S.act({
          apply: function () {
            var s = findSession(sid); if (!s) return;
            s.task_id = newTask; s.day = dayV; s.start = sV; s.end = eV; s.title = title;
            if (oldTask) Dominio.syncTaskState(S.week, oldTask);
            if (newTask) Dominio.syncTaskState(S.week, newTask);
          },
          request: function () { return API.updateSession(key, sid, { task_id: newTask, day: dayV, start: sV, end: eV }); },
          after: function (data) { replaceSession(sid, data && data.session); }
        });
      } else {
        var tmpId = "tmp-" + U.newId(), taskId = sel.id;
        S.act({
          apply: function () {
            S.week.sessions.push({ id: tmpId, task_id: taskId, day: dayV, start: sV, end: eV, title: title });
            Dominio.syncTaskState(S.week, taskId);
          },
          request: function () { return API.addSession(key, taskId, dayV, sV, eV); },
          after: function (data) { replaceSession(tmpId, data && data.session); }
        });
      }
    }
    function replaceSession(id, fresh) {
      if (!fresh || !S.week) return;
      var i = S.week.sessions.findIndex(function (x) { return x.id === id; });
      if (i >= 0) S.week.sessions[i] = fresh;
      if (fresh.task_id) Dominio.syncTaskState(S.week, fresh.task_id);
    }
  }

  function removeSession(session, hd) {
    var t = taskOf(session), nombre = t ? t.name : "esta tarea";
    Shell.confirm({
      kicker: "QUITAR DEL HORARIO", title: "¿Quitar este bloque de " + nombre + " del horario?",
      msg: "La tarea no se elimina de la lista. Si no conserva otras sesiones, volverá a SIN EMPEZAR.",
      ok: "Quitar del horario", danger: true
    }).then(function (ok) {
      if (!ok) return;
      if (hd) hd.close();
      var sid = session.id, taskId = session.task_id, key = S.weekKey();
      S.act({
        apply: function () {
          S.week.sessions = S.week.sessions.filter(function (x) { return x.id !== sid; });
          if (taskId) Dominio.syncTaskState(S.week, taskId);
        },
        request: function () { return API.deleteSession(key, sid); }
      });
    });
  }

  /* ---------- editor de sueño ---------- */
  function openSleepDialog(initialDay) {
    var week = S.week; if (!week) return;
    var day = U.clamp(initialDay == null ? S.ui.day : initialDay, 0, 6);
    var h = '<div class="small" style="margin-bottom:10px">Cada noche se asocia al día en que te levantas. Deja ambos campos vacíos para no registrar esa noche.</div>' +
      '<div class="table-wrap"><table class="table sl"><thead><tr><th>Día</th><th>Me acosté</th><th>Me levanté</th><th>Duración</th><th></th></tr></thead><tbody>';
    for (var d = 0; d < 7; d++) {
      var rec = (week.sleep || {})[String(d)] || {};
      h += '<tr class="' + (d === day ? "sel" : "") + '" data-row="' + d + '"><td class="sl-day">' + U.DAY_NAMES_LONG[d] + '</td>' +
        '<td><input class="input mono" id="sl-bed-' + d + '" placeholder="HH:MM" autocomplete="off" value="' + U.esc(rec.bed || "") + '"></td>' +
        '<td><input class="input mono" id="sl-wake-' + d + '" placeholder="HH:MM" autocomplete="off" value="' + U.esc(rec.wake || "") + '"></td>' +
        '<td class="mono sl-dur" id="sl-dur-' + d + '">—</td>' +
        '<td><button type="button" class="btn icon ghost" data-clear="' + d + '" title="Vaciar">×</button></td></tr>';
    }
    h += '</tbody></table></div>';
    Shell.modal({
      kicker: "SLEEP LOG", kickerAccent: true, title: "Registro de sueño de la semana", width: 680, html: h, hint: "Formato HH:MM  ·  máximo 16 h",
      footer: [
        { label: "Cancelar", kind: "secondary", onClick: function (hd) { hd.close(); } },
        { label: "Guardar semana", kind: "primary", onClick: function (hd) { saveAll(hd); } }
      ],
      onOpen: function (hd) {
        for (var d = 0; d < 7; d++) (function (d) {
          var bed = $("#sl-bed-" + d, hd.el), wake = $("#sl-wake-" + d, hd.el);
          function upd() {
            var b = bed.value.trim(), w = wake.value.trim(), out = $("#sl-dur-" + d, hd.el);
            if (!b && !w) { out.textContent = "—"; return; }
            if (!b || !w) { out.textContent = "INCOMPLETO"; return; }
            try { out.textContent = U.formatDuration(U.sleepDurationMinutes(b, w)); } catch (e) { out.textContent = "HORA ?"; }
          }
          bed.addEventListener("input", upd); wake.addEventListener("input", upd); upd();
          $("[data-clear='" + d + "']", hd.el).addEventListener("click", function () { bed.value = ""; wake.value = ""; upd(); });
        })(d);
        var focus = $("#sl-bed-" + day, hd.el);
        if (focus) setTimeout(function () { try { focus.focus(); focus.select(); } catch (e) { } }, 40);
      },
      noFocus: true
    });
    function saveAll(hd) {
      var parsed = {};
      for (var d = 0; d < 7; d++) {
        var b = $("#sl-bed-" + d, hd.el).value.trim(), w = $("#sl-wake-" + d, hd.el).value.trim();
        if (!b && !w) continue;
        if (!b || !w) { Shell.toast(U.DAY_NAMES_LONG[d] + ": completa ambas horas o deja ambas vacías.", "bad"); return; }
        try { U.sleepDurationMinutes(b, w); } catch (e) { Shell.toast(U.DAY_NAMES_LONG[d] + ": " + e.message, "bad"); return; }
        parsed[String(d)] = { bed: b, wake: w };
      }
      var key = S.weekKey();
      hd.close();
      S.act({
        apply: function () { S.week.sleep = parsed; },
        request: function () { return API.setSleep(key, parsed); },
        after: function (data) { if (data && data.sleep && S.week) S.week.sleep = data.sleep; }
      });
    }
  }

  return {
    render: render, toggleView: toggleView, openSessionDialog: openSessionDialog, openSleepDialog: openSleepDialog,
    openTaskPicker: openTaskPicker, removeSession: removeSession, statusText: statusText, STATUS_DEFAULT: STATUS_DEFAULT,
    HOUR_H: HOUR_H, HEAD_H: HEAD_H
  };
})();


/* ==== 50-historial.js ==== */
/* Hist — pantalla HISTORIAL: archivo semanal (SEMANA), vista MES con DAY LOG y TENDENCIAS.
   Puerto de app.py 2233-2997. Todo se pinta desde S; las semanas cerradas completas se piden
   con S.loadWeek(key) y se cachean en S.weeks; MES y TENDENCIAS usan S.index (agregados). */
var Hist = (function () {
  var TABS = [["semana", "SEMANA"], ["mes", "MES"], ["tendencias", "TENDENCIAS"]];
  var RESULT = { finished: ["Terminada", "open"], unfinished: ["No terminada", "warn"], cancelled: ["Cancelada", "bad"] };
  var loading = {};     // key -> [callbacks] mientras se carga una semana
  var rootEl = null;

  function esc(s) { return U.esc(s); }
  function fmtH(v) { return String(Math.round(v * 10) / 10).replace(".", ",") + " h"; }
  function fmtPct(v) { return Math.round(v) + " %"; }
  function fmtInt(v) { return String(Math.round(v)); }
  function statsOf(week) { return week.stats || Stats.compute(week, S.settings); }
  function sessionMinutes(s) { return Math.max(0, Stats.sessionMinutes(s, S.startHour())); }
  function ddmm(iso) { var d = U.parseIso(iso); return U.pad2(d.getDate()) + "/" + U.pad2(d.getMonth() + 1); }
  function ddmmyyyy(iso) { return ddmm(iso) + "/" + iso.slice(0, 4); }

  function metric(label, value, color, sub) {
    return '<div class="metric" style="--metric:' + esc(color || "var(--text)") + '"><div class="k">' + esc(label) + '</div><div class="v">' + esc(value) + '</div>' +
      (sub ? '<div class="s">' + esc(sub) + '</div>' : "") + '</div>';
  }
  function secHead(code, title, sub) {
    return '<div class="sec-head"><div class="code">' + esc(code) + '</div><div class="title">' + esc(title) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : "") + '</div>';
  }
  function areaTag(id) { return '<span class="area-tag" style="color:' + esc(S.areaColor(id)) + '">' + esc(S.areaName(id)) + '</span>'; }
  function noTask() { return '<span class="chip warn">SIN TAREA</span>'; }
  function resultChip(outcome) { var r = RESULT[outcome]; return r ? '<span class="chip ' + r[1] + '">' + r[0] + '</span>' : '<span class="chip">—</span>'; }
  function chart(title, svg) { return '<div class="chart">' + (title ? '<div class="chart-t">' + esc(title) + '</div>' : "") + svg + '</div>'; }
  function dur(m) { return m == null ? "—" : U.formatDuration(m); }

  /* ---------- carga perezosa de semanas ---------- */
  function load(key, cb) {
    if (loading[key]) { if (cb) loading[key].push(cb); return; }
    loading[key] = cb ? [cb] : [];
    S.loadWeek(key).then(function () {
      var cbs = loading[key] || []; delete loading[key];
      rerender();
      cbs.forEach(function (f) { try { f(); } catch (e) { if (window.console) console.error(e); } });
    }).catch(function (e) {
      delete loading[key];
      Shell.toast(e && e.message ? e.message : String(e), "bad");
    });
  }
  function rerender() {
    if (S.ui.screen !== "historial") return;
    if (rootEl && rootEl.isConnected) render(rootEl); else Shell.render();
  }

  /* ---------- render ---------- */
  function render(root) {
    rootEl = root;
    var keys = S.closedKeys();
    if (!S.ui.histKey || keys.indexOf(S.ui.histKey) < 0) S.ui.histKey = keys[0] || null;
    if (!S.ui.month) S.ui.month = (S.ui.histKey || S.weekKey() || U.todayIso()).slice(0, 7);
    if (!TABS.some(function (t) { return t[0] === S.ui.histTab; })) S.ui.histTab = "semana";
    root.innerHTML = topHtml() + '<div class="hist">' + sideHtml(keys) +
      '<div class="hist-main">' + selectHtml(keys) + tabsHtml() + '<div class="hist-body" id="hist-body"></div></div></div>';
    var body = root.querySelector("#hist-body");
    var w = chartWidth(body);
    body.innerHTML = S.ui.histTab === "semana" ? weekTab(keys, w) : S.ui.histTab === "mes" ? monthTab(w) : trendsTab(w);
    bind(root);
  }
  function chartWidth(el) { var w = el && el.clientWidth ? el.clientWidth - 24 : 700; return Math.max(300, Math.min(760, w)); }

  function topHtml() {
    return '<div class="hist-top"><div><h1>HISTORIAL</h1><div class="sub">MISSION ARCHIVE  ·  semanas cerradas y telemetría personal</div></div></div>';
  }
  function itemMeta(key) {
    var e = S.index[key], st = e && e.stats;
    if (!st) return "";
    var n = (st.counts.finished || 0) + (st.counts.unfinished || 0) + (st.counts.cancelled || 0);
    return fmtPct(st.completion) + "  ·  " + fmtH(st.total_logged_minutes / 60) + "  ·  " + U.plural(n, "tarea");
  }
  function sideHtml(keys) {
    var items = keys.length ? keys.map(function (k) {
      return '<button class="item' + (k === S.ui.histKey ? " on" : "") + '" data-hk="' + esc(k) + '"><div class="r">' + esc(U.formatWeekRange(k)) + '</div><div class="m">' + esc(itemMeta(k)) + '</div></button>';
    }).join("") : '<div class="empty"><div class="kicker">NO ARCHIVED WEEKS</div>Aún no hay semanas cerradas.</div>';
    return '<aside class="hist-side"><div class="head"><div class="kicker">WEEK LOGS</div><div class="section-title">Archivo semanal</div></div>' + items + '</aside>';
  }
  function selectHtml(keys) {
    if (!keys.length) return "";
    return '<div class="hist-select"><select class="select" id="hist-sel">' + keys.map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === S.ui.histKey ? " selected" : "") + '>' + esc(U.formatWeekRange(k)) + ' · ' + esc(itemMeta(k)) + '</option>';
    }).join("") + '</select></div>';
  }
  function tabsHtml() {
    return '<div class="hist-tabs">' + TABS.map(function (t) {
      return '<button data-ht="' + t[0] + '" class="' + (S.ui.histTab === t[0] ? "on" : "") + '">' + t[1] + '</button>';
    }).join("") + '</div>';
  }

  function bind(root) {
    // Un solo listener delegado por root: render() se llama varias veces sobre el mismo
    // elemento (cargas asíncronas) y sin esta guarda cada clic se procesaba N veces.
    if (root._histBound) { bindSelect(root); return; }
    root._histBound = true;
    root.addEventListener("click", function (e) {
      var hk = e.target.closest("[data-hk]");
      if (hk) { selectWeek(hk.getAttribute("data-hk")); return; }
      var ht = e.target.closest("[data-ht]");
      if (ht) { S.ui.histTab = ht.getAttribute("data-ht"); render(root); return; }
      var md = e.target.closest("[data-mdelta]");
      if (md) { changeMonth(parseInt(md.getAttribute("data-mdelta"), 10)); render(root); return; }
      var day = e.target.closest("[data-day]");
      if (day) { openDayLog(day.getAttribute("data-day")); }
    });
    bindSelect(root);
  }
  function bindSelect(root) {
    var sel = root.querySelector("#hist-sel");
    if (sel) sel.addEventListener("change", function () { selectWeek(sel.value); });
  }
  function selectWeek(key) {
    S.ui.histKey = key;
    if (S.ui.histTab === "mes") S.ui.month = key.slice(0, 7);
    if (S.ui.histTab === "tendencias") S.ui.histTab = "semana";
    rerender();
  }
  function changeMonth(delta) {
    var y = parseInt(S.ui.month.slice(0, 4), 10), m = parseInt(S.ui.month.slice(5, 7), 10);
    var d = new Date(y, m - 1 + delta, 1, 12);
    S.ui.month = d.getFullYear() + "-" + U.pad2(d.getMonth() + 1);
  }

  /* ---------- SEMANA ---------- */
  function weekTab(keys, w) {
    if (!keys.length) return '<div class="empty"><div class="kicker">NO ARCHIVED WEEKS</div>Aún no hay semanas cerradas. La pestaña MES ya muestra la semana abierta; la vista semanal aparecerá al cerrar una semana.</div>';
    var key = S.ui.histKey, week = S.weeks[key];
    if (!(week && week.closed)) { load(key); return '<div class="loading" style="padding:48px 0"><span class="dot"></span>CARGANDO SEMANA…</div>'; }
    return weekHtml(week, w);
  }

  function weekHtml(week, w) {
    var st = statsOf(week), areas = S.areas(), out = "";
    var completion = st.completion_base ? fmtPct(st.completion) : "—";
    out += '<div class="hero"><div><div class="kicker accent">ARCHIVED WEEK</div><div class="range">' + esc(U.formatWeekRange(week.start_date)) + '</div>' +
      '<div class="meta">' + esc(st.session_count + " sesiones  ·  " + dur(st.total_logged_minutes) + " registradas  ·  " + st.active_days + "/7 días con actividad") + '</div></div>' +
      '<div class="score"><div class="k">CUMPLIMIENTO</div><div class="v">' + esc(completion) + '</div><div class="s">canceladas excluidas</div></div></div>';

    // 01 // TASKS
    out += secHead("01 // TASKS", "Resultados de tareas", "Estado final decidido al cerrar la semana; las canceladas permanecen separadas del cumplimiento.");
    out += '<div class="metrics">' +
      metric("TERMINADAS", st.counts.finished, "var(--success)", "de " + st.completion_base + " objetivos evaluables") +
      metric("NO TERMINADAS", st.counts.unfinished, "var(--warn)", st.never_started + " sin empezar") +
      metric("CANCELADAS", st.counts.cancelled, "var(--danger)", "horas invertidas conservadas") +
      metric("CONTINUADAS", st.carried_out, "var(--accent)", "entran " + st.carried_in + " → continúan " + st.carried_out) +
      metric("COMPLETADO", completion, "var(--text)", "terminadas / evaluables") + '</div>';
    out += '<div class="card2 table-wrap"><table class="table"><thead><tr><th>Área</th><th class="num">Tareas</th><th class="num">Terminadas</th><th class="num">No term.</th><th class="num">Canc.</th><th class="num">Tiempo</th><th class="num">Sesiones</th></tr></thead><tbody>';
    areas.forEach(function (a) {
      var c = (st.area_task_counts && st.area_task_counts[a.id]) || { total: 0, finished: 0, unfinished: 0, cancelled: 0 };
      var mins = st.minutes_by_area ? (st.minutes_by_area[a.id] || 0) : ((st.hours_by_area && st.hours_by_area[a.id]) || 0) * 60;
      out += '<tr><td>' + areaTag(a.id) + '</td><td class="num">' + c.total + '</td><td class="num">' + c.finished + '</td><td class="num">' + c.unfinished + '</td><td class="num">' + c.cancelled + '</td><td class="num">' + esc(dur(mins)) + '</td><td class="num">' + ((st.sessions_by_area && st.sessions_by_area[a.id]) || 0) + '</td></tr>';
    });
    out += '</tbody></table></div>';
    out += '<div class="card2 table-wrap"><table class="table"><thead><tr><th>Área</th><th>Tarea</th><th>Resultado</th><th class="num">Tiempo</th><th class="num">Ses.</th><th>Finalizada</th></tr></thead><tbody>';
    if (!week.tasks.length) out += '<tr><td colspan="6" class="muted2">Sin tareas.</td></tr>';
    week.tasks.forEach(function (t) {
      out += '<tr><td>' + areaTag(t.area) + '</td><td>' + (t.carried ? '<span class="carried">*  </span>' : "") + esc(t.name) + (t.fixed ? ' <span class="tiny">FIJA</span>' : "") + '</td><td>' + resultChip(t.outcome) + '</td>' +
        '<td class="num">' + esc(dur(Dominio.sessionMinutes(week, t.id, S.settings))) + '</td><td class="num">' + Dominio.sessionCount(week, t.id) + '</td><td class="mono">' + esc(U.formatDateTime(t.completed_at)) + '</td></tr>';
    });
    out += '</tbody></table></div>';

    // 02 // TIME
    out += secHead("02 // TIME", "Actividad registrada", "Sesiones reales del calendario. Los eventos de contexto (clases, viajes) no se suman como trabajo.");
    out += '<div class="metrics">' +
      metric("REGISTRADO", dur(st.total_logged_minutes), "var(--accent)") +
      metric("SESIONES", st.session_count, "var(--text)") +
      metric("MEDIA / SESIÓN", dur(st.avg_session_minutes), "var(--text)") +
      metric("MÁS LARGA", dur(st.longest_session_minutes), "var(--text)") +
      metric("NO REGISTRADO", dur(st.unregistered_minutes), "var(--muted)", "excluye contexto y sueño") +
      metric("DÍAS ACTIVOS", st.active_days + "/7", "var(--text)") + '</div>';
    out += chart("ACTIVIDAD POR DÍA Y ÁREA (h)", Graf.stackedBars({
      width: w, height: 190, format: fmtH, labels: U.DAY_NAMES,
      series: areas.map(function (a) { return { id: a.id, label: a.short, color: a.color, values: st.daily_area_minutes.map(function (d) { return (d[a.id] || 0) / 60; }) }; })
    }));
    var taskMap = {}; week.tasks.forEach(function (t) { taskMap[t.id] = t; });
    var sessions = week.sessions.slice().sort(function (a, b) { return (a.day - b.day) || (U.calendarMinute(a.start, S.startHour()) - U.calendarMinute(b.start, S.startHour())); });
    out += '<div class="card2 table-wrap"><table class="table"><thead><tr><th>Día</th><th>Hora</th><th>Área</th><th>Tarea</th><th class="num">Duración</th></tr></thead><tbody>';
    if (!sessions.length) out += '<tr><td colspan="5" class="muted2">Sin sesiones registradas.</td></tr>';
    sessions.forEach(function (s) {
      var t = s.task_id ? taskMap[s.task_id] : null;
      out += '<tr><td>' + esc(U.DAY_NAMES_LONG[s.day] || "") + '</td><td class="mono">' + esc(s.start + "–" + s.end) + '</td><td>' + (t ? areaTag(t.area) : noTask()) + '</td><td>' + esc(t ? t.name : (s.title || "")) + '</td><td class="num">' + esc(dur(sessionMinutes(s))) + '</td></tr>';
    });
    out += '</tbody></table></div>';

    // 03 // SLEEP
    out += secHead("03 // SLEEP", "Sueño", "Registro independiente: nunca se suma al tiempo no registrado.");
    var nights = st.sleep_by_day.filter(function (v) { return v != null; }).length;
    out += '<div class="metrics">' +
      metric("NOCHES", nights + "/7", "var(--accent)") +
      metric("MEDIA", dur(st.sleep_avg_minutes), "var(--text)") +
      metric("MÍNIMO", dur(st.sleep_min_minutes), "var(--warn)") +
      metric("MÁXIMO", dur(st.sleep_max_minutes), "var(--success)") +
      metric("ACOSTARSE", st.avg_bed, "var(--text)", "hora media") +
      metric("LEVANTARSE", st.avg_wake, "var(--text)", "hora media") + '</div>';
    out += '<div class="sleep-strip">' + U.DAY_NAMES.map(function (n, i) {
      var rec = week.sleep[String(i)], m = st.sleep_by_day[i];
      return '<div class="c"><div class="d">' + esc(n.toUpperCase()) + '</div>' + (m != null && rec ? '<div class="v">' + esc(dur(m)) + '</div><div class="h">' + esc(rec.bed + "→" + rec.wake) + '</div>' : '<div class="v muted2">—</div>') + '</div>';
    }).join("") + '</div>';
    var half = Math.max(300, Math.min(w, Shell.isMobile() ? w : Math.floor((w - 10) / 2)));
    out += '<div class="charts2">' +
      chart("DURACIÓN (h)", Graf.bars({ width: half, height: 170, format: fmtH, labels: U.DAY_NAMES, values: st.sleep_by_day.map(function (m) { return m == null ? null : m / 60; }) })) +
      chart("HORARIO NOCTURNO", Graf.sleepBands({ width: half, height: 170, labels: U.DAY_NAMES, beds: st.bed_by_day, wakes: st.wake_by_day })) +
      '</div>';
    return out;
  }

  /* ---------- MES ---------- */
  function monthSnapshot(ym) {
    var y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(5, 7), 10);
    var daysIn = new Date(y, m, 0).getDate();
    var areas = S.areas(), totals = {};
    areas.forEach(function (a) { totals[a.id] = 0; });
    var daily = {}, sessions = 0, sleepVals = [], cc = { finished: 0, unfinished: 0, cancelled: 0 }, pending = [], partial = false;
    function inMonth(iso) { return iso.slice(0, 7) === ym; }
    function ensure(iso, key, d) {
      var r = daily[iso];
      if (!r) {
        r = daily[iso] = { iso: iso, weekKey: key, day: d, minutes: {}, total: 0, sessions: [], sessionsKnown: true, sleep: null, sleepRec: null, completed: [] };
        areas.forEach(function (a) { r.minutes[a.id] = 0; });
      }
      return r;
    }
    function addWeek(key, week, entry, isOpen) {
      var last = U.isoAddDays(key, 6);
      if (last.slice(0, 7) < ym || key.slice(0, 7) > ym) return;
      var st = week ? statsOf(week) : (entry && entry.stats);
      if (!st) return;
      var full = !!week;
      if (!full) pending.push(key);
      var taskMap = {};
      if (week) week.tasks.forEach(function (t) { taskMap[t.id] = t; });
      for (var d = 0; d < 7; d++) {
        var iso = U.isoAddDays(key, d);
        if (!inMonth(iso)) continue;
        var per = (st.daily_area_minutes && st.daily_area_minutes[d]) || {};
        var tot = st.minutes_by_day ? (st.minutes_by_day[d] || 0) : U.sum(Object.keys(per).map(function (k) { return per[k]; }));
        var slp = st.sleep_by_day ? st.sleep_by_day[d] : null;
        var r = null;
        if (tot || slp != null) r = ensure(iso, key, d);
        if (r) { areas.forEach(function (a) { var v = per[a.id] || 0; r.minutes[a.id] += v; totals[a.id] += v; }); r.total += tot; }
        if (r && slp != null) { r.sleep = slp; sleepVals.push(slp); if (week && week.sleep && week.sleep[String(d)]) r.sleepRec = week.sleep[String(d)]; }
        if (full) {
          var ss = week.sessions.filter(function (s) { return (s.day | 0) === d; });
          if (ss.length) {
            r = r || ensure(iso, key, d);
            ss.forEach(function (s) {
              var t = s.task_id ? taskMap[s.task_id] : null;
              r.sessions.push({ start: s.start, end: s.end, minutes: sessionMinutes(s), area: t ? t.area : null, task: t ? t.name : (s.title || "Sin tarea") });
            });
            sessions += ss.length;
          }
        } else if (r) { r.sessionsKnown = false; partial = true; }
      }
      if (!full && key.slice(0, 7) === ym && last.slice(0, 7) === ym) sessions += st.session_count || 0;
      if (!isOpen) {
        if (key.slice(0, 7) === ym && st.counts) { cc.finished += st.counts.finished || 0; cc.unfinished += st.counts.unfinished || 0; cc.cancelled += st.counts.cancelled || 0; }
        var fin = week
          ? week.tasks.filter(function (t) { return t.outcome === "finished" && t.completed_at; }).map(function (t) { return { name: t.name, area: t.area, completed_at: t.completed_at }; })
          : ((entry && entry.finished) || []);
        fin.forEach(function (f) {
          var iso = String(f.completed_at || "").slice(0, 10);
          if (!inMonth(iso)) return;
          ensure(iso, key, U.daysBetween(key, iso)).completed.push(f.name);
        });
      }
    }
    S.closedKeys().forEach(function (k) { var wk = S.weeks[k]; addWeek(k, (wk && wk.closed) ? wk : null, S.index[k], false); });
    if (S.week && !S.week.closed) addWeek(S.week.start_date, S.week, null, true);
    var activeDays = Object.keys(daily).filter(function (k) { return daily[k].total > 0; }).length;
    var base = cc.finished + cc.unfinished;
    return {
      ym: ym, y: y, m: m, daysIn: daysIn, daily: daily, totals: totals, sessions: sessions, active_days: activeDays,
      sleep_avg: sleepVals.length ? U.sum(sleepVals) / sleepVals.length : null, sleep_nights: sleepVals.length,
      closed_counts: cc, completion: base ? (cc.finished / base) * 100 : null, pending: pending, partial: partial
    };
  }

  function monthTab(w) {
    var snap = monthSnapshot(S.ui.month), areas = S.areas(), out = "";
    snap.pending.forEach(function (k) { load(k); });
    var titulo = U.MONTH_NAMES[snap.m - 1].toUpperCase() + " " + snap.y;
    out += '<div class="mes-nav"><button class="btn icon" data-mdelta="-1" aria-label="Mes anterior">‹</button><div class="title">' + esc(titulo) + '</div><button class="btn icon" data-mdelta="1" aria-label="Mes siguiente">›</button>' +
      '<div class="hint">MONTH LOG  ·  clic en un día para abrir el detalle' + (snap.partial ? '  ·  cargando detalle…' : "") + '</div></div>';
    out += '<div class="metrics">' + areas.map(function (a) { return metric(a.short, dur(snap.totals[a.id]), a.color, a.name.toLowerCase()); }).join("") +
      metric("SESIONES", snap.sessions, "var(--text)", snap.active_days + " días activos") +
      metric("SUEÑO MEDIO", dur(snap.sleep_avg), "var(--accent)", snap.sleep_nights + " noches") +
      metric("CUMPLIMIENTO", snap.completion == null ? "—" : fmtPct(snap.completion), "var(--success)", "solo semanas cerradas") + '</div>';

    // rejilla
    var first = new Date(snap.y, snap.m - 1, 1, 12), lastDay = new Date(snap.y, snap.m, 0, 12);
    var gridStart = U.mondayOf(first);
    var rows = Math.ceil((U.daysBetween(U.isoDate(gridStart), U.isoDate(lastDay)) + 1) / 7);
    var today = U.todayIso();
    out += '<div class="mes-grid">' + U.DAY_NAMES.map(function (n) { return '<div class="dow">' + esc(n.toUpperCase()) + '</div>'; }).join("");
    for (var i = 0; i < rows * 7; i++) {
      var d = U.addDays(gridStart, i), iso = U.isoDate(d);
      if (iso.slice(0, 7) !== snap.ym) { out += '<div class="cell out"><div class="num">' + d.getDate() + '</div></div>'; continue; }
      var rec = snap.daily[iso], cls = "cell" + (iso === today ? " today" : "");
      var inner = '<div class="num">' + d.getDate() + '</div>';
      if (!rec) inner += '<div class="none">—</div>';
      else {
        if (rec.total) {
          inner += '<div class="tot">' + esc(dur(rec.total)) + '</div>';
          inner += '<div class="mini">' + areas.map(function (a) { var v = rec.minutes[a.id] || 0; return v ? '<i style="width:' + (v / rec.total * 100).toFixed(1) + '%;background:' + esc(a.color) + '"></i>' : ""; }).join("") + '</div>';
          areas.forEach(function (a) { var v = rec.minutes[a.id] || 0; if (v) inner += '<div class="ar" style="color:' + esc(a.color) + '">' + esc(a.short + " " + dur(v)) + '</div>'; });
        }
        if (rec.sleep != null) inner += '<div class="slp">' + esc("SLP " + dur(rec.sleep)) + '</div>';
        if (rec.completed.length) inner += '<div class="fin">' + esc("✓ " + U.plural(rec.completed.length, "finalizada")) + '</div>';
      }
      out += '<button class="' + cls + '" data-day="' + esc(iso) + '">' + inner + '</button>';
    }
    out += '</div>';

    // gráficos del mes
    var labels = [], byArea = {}, sleepVals = [];
    areas.forEach(function (a) { byArea[a.id] = []; });
    for (var dn = 1; dn <= snap.daysIn; dn++) {
      var isoD = snap.ym + "-" + U.pad2(dn), r = snap.daily[isoD];
      labels.push(String(dn));
      areas.forEach(function (a) { byArea[a.id].push(r ? (r.minutes[a.id] || 0) / 60 : 0); });
      sleepVals.push(r && r.sleep != null ? r.sleep / 60 : null);
    }
    out += secHead("MONTH // SIGNALS", "Vista diaria", "Actividad apilada por área y sueño registrado a lo largo del mes.");
    out += chart("HORAS REGISTRADAS POR DÍA", Graf.stackedBars({ width: w, height: 190, format: fmtH, labels: labels, series: areas.map(function (a) { return { id: a.id, label: a.short, color: a.color, values: byArea[a.id] }; }) }));
    out += chart("SUEÑO POR DÍA (h)", Graf.bars({ width: w, height: 150, format: fmtH, labels: labels, values: sleepVals }));
    return out;
  }

  function dayLogHtml(rec) {
    if (!rec) return '<div class="empty">Sin actividad ni sueño registrado.</div>';
    var out = '<div class="daylog-top"><div class="t">' + esc(dur(rec.total) + " registradas") + '</div>' +
      (rec.sleep != null ? '<span class="chip accent">' + esc("SLEEP " + (rec.sleepRec ? rec.sleepRec.bed + "→" + rec.sleepRec.wake + " · " : "") + dur(rec.sleep)) + '</span>' : "") + '</div>';
    if (!rec.sessionsKnown) out += '<div class="loading" style="padding:18px 0"><span class="dot"></span>CARGANDO SESIONES…</div>';
    else if (!rec.sessions.length) out += '<div class="small" style="margin-bottom:8px">Sin sesiones registradas.</div>';
    else {
      var ss = rec.sessions.slice().sort(function (a, b) { return U.calendarMinute(a.start, S.startHour()) - U.calendarMinute(b.start, S.startHour()); });
      out += '<div class="card2 table-wrap"><table class="table"><thead><tr><th>Hora</th><th>Área</th><th>Tarea</th><th class="num">Duración</th></tr></thead><tbody>' + ss.map(function (s) {
        return '<tr><td class="mono">' + esc(s.start + "–" + s.end) + '</td><td>' + (s.area ? areaTag(s.area) : noTask()) + '</td><td>' + esc(s.task) + '</td><td class="num">' + esc(dur(s.minutes)) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
    }
    if (rec.completed.length) {
      out += '<div class="card2 daylog-fin" style="padding:8px 12px"><div class="kicker" style="color:var(--success)">TAREAS FINALIZADAS ESE DÍA</div>' +
        rec.completed.map(function (n) { return '<div class="row">✓  ' + esc(n) + '</div>'; }).join("") + '</div>';
    }
    return out;
  }
  function openDayLog(iso) {
    var ym = iso.slice(0, 7), rec = monthSnapshot(ym).daily[iso];
    var d = U.parseIso(iso);
    var h = Shell.modal({
      kicker: "DAY LOG", kickerAccent: true, title: U.DAY_NAMES_LONG[(d.getDay() + 6) % 7] + " · " + ddmmyyyy(iso), width: 640,
      html: dayLogHtml(rec), noFocus: true,
      footer: [{ label: "Cerrar", kind: "secondary", onClick: function (hh) { hh.close(); } }]
    });
    if (rec && !rec.sessionsKnown && rec.weekKey) {
      load(rec.weekKey, function () { if (h.el.isConnected) h.body.innerHTML = dayLogHtml(monthSnapshot(ym).daily[iso]); });
    }
    return h;
  }

  /* ---------- TENDENCIAS ---------- */
  function trendsTab(w) {
    var keys = S.closedKeys().slice().reverse();
    if (!keys.length) return '<div class="empty"><div class="kicker">NO TREND DATA</div>Necesitas al menos una semana cerrada.</div>';
    var areas = S.areas(), labels = [], comp = [], sleep = [], logged = [], unf = [], canc = [], carried = [], byArea = {};
    areas.forEach(function (a) { byArea[a.id] = []; });
    keys.forEach(function (k) {
      var e = S.index[k], st = (e && e.stats) || (S.weeks[k] && statsOf(S.weeks[k]));
      if (!st) return;
      labels.push(ddmm(k));
      comp.push(st.completion_base ? st.completion : null);
      sleep.push(st.sleep_avg_minutes == null ? null : st.sleep_avg_minutes / 60);
      logged.push(st.total_logged_minutes / 60);
      unf.push(st.counts.unfinished || 0); canc.push(st.counts.cancelled || 0); carried.push(st.carried_out || 0);
      areas.forEach(function (a) { byArea[a.id].push((st.hours_by_area && st.hours_by_area[a.id]) || 0); });
    });
    var compValid = comp.filter(function (v) { return v != null; }), sleepValid = sleep.filter(function (v) { return v != null; });
    var out = secHead("LONG RANGE", "Tendencias", "Evolución objetiva entre semanas cerradas. Bitácora representa datos; no los interpreta.");
    out += '<div class="metrics">' +
      metric("SEMANAS", labels.length, "var(--text)") +
      metric("CUMPLIMIENTO", compValid.length ? fmtPct(U.sum(compValid) / compValid.length) : "—", "var(--success)", "media") +
      metric("REGISTRADO", fmtH(logged.length ? U.sum(logged) / logged.length : 0), "var(--accent)", "media / semana") +
      metric("SUEÑO", sleepValid.length ? fmtH(U.sum(sleepValid) / sleepValid.length) : "—", "var(--accent)", "media") +
      metric("ARRASTRADAS", U.sum(carried), "var(--warn)", "acumulado") + '</div>';
    out += chart("CUMPLIMIENTO SEMANAL (%) · canceladas excluidas", Graf.lines({ width: w, height: 160, yMax: 100, format: fmtPct, labels: labels, series: [{ label: "Cumplimiento", color: "var(--success)", values: comp }] }));
    out += chart("HORAS REGISTRADAS POR ÁREA", Graf.stackedBars({ width: w, height: 200, format: fmtH, labels: labels, series: areas.map(function (a) { return { id: a.id, label: a.short, color: a.color, values: byArea[a.id] }; }) }));
    out += chart("SUEÑO MEDIO (h)", Graf.lines({ width: w, height: 150, format: fmtH, labels: labels, series: [{ label: "Sueño", color: "var(--accent)", values: sleep }] }));
    out += chart("TAREAS NO TERMINADAS / CANCELADAS / CONTINÚAN", Graf.stackedBars({
      width: w, height: 180, format: fmtInt, labels: labels,
      series: [{ id: "unf", label: "No terminadas", color: "var(--warn)", values: unf }, { id: "canc", label: "Canceladas", color: "var(--danger)", values: canc }, { id: "carr", label: "Continúan", color: "var(--accent)", values: carried }]
    }));
    return out;
  }

  return { render: render, monthSnapshot: monthSnapshot, openDayLog: openDayLog, weekHtml: weekHtml, dayLogHtml: dayLogHtml };
})();


/* ==== 51-graficos.js ==== */
/* Graf — gráficos SVG inline sin librerías. Cada función devuelve un string <svg> con viewBox
   fijo (ancho configurable, alto fijo) y width 100 %; el contenedor decide el tamaño real.
   Ejes en --muted2, rejilla --grid-soft, etiquetas monoespaciadas de 10 px, tooltips por <title>. */
var Graf = (function () {
  var FONT = "font-family:var(--mono);font-size:10px";
  var AXIS = "var(--muted2)", GRID = "var(--grid-soft)", INK = "var(--muted)";

  function esc(s) { return U.esc(s); }
  function num(v) { return Math.round(v * 100) / 100; }

      draft[f] = parseInt(el.value, 10);
      if (f === "cal_start_hour") {
        var span = S.settings.cal_end_hour - S.settings.cal_start_hour;
        draft.cal_end_hour = U.clamp(draft.cal_start_hour + span, draft.cal_start_hour + 12, draft.cal_start_hour + 24);
      }
    } else draft[f] = el.value;
    tocar();
  }

  function bind(root) {
    root.addEventListener("input", function (e) {
      var el = e.target;
      if (el.id === "aj-nueva") { nuevaArea = el.value; return; }
      if (el.hasAttribute("data-field")) {
        leerCampo(el);
        if (el.getAttribute("data-field") === "color") { var sw = $(".aj-swatch", el.closest("tr")); if (sw) sw.style.background = el.value; }
        actualizarBarra(root);
      }
    });
    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el.hasAttribute("data-cal")) { alternarCalendario(S.calendars[parseInt(el.getAttribute("data-cal"), 10)], el.checked); actualizarBarra(root); return; }
      if (el.hasAttribute("data-field")) {
        leerCampo(el);
        var f = el.getAttribute("data-field");
        if (f === "cal_start_hour" || f === "gcolor" || f === "short") render(root);
      }
    });
    root.addEventListener("click", function (e) {
      var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
      var act = b.getAttribute("data-act"), idx = parseInt(b.getAttribute("data-idx"), 10);
      if (act === "subir" || act === "bajar") { var j = act === "subir" ? idx - 1 : idx + 1; if (j < 0 || j >= draft.areas.length) return; var tmp = draft.areas[idx]; draft.areas[idx] = draft.areas[j]; draft.areas[j] = tmp; tocar(); render(root); }
      else if (act === "quitar") quitarArea(idx, root);
      else if (act === "anadir") anadirArea(root);
      else if (act === "releer") releer(root);
      else if (act === "guardar") guardar();
      else if (act === "descartar") { dirty = false; draft = null; nuevaArea = ""; render(root); }
      else if (act === "probar") probar(root);
      else if (act === "conectar") conectar(root);
      else if (act === "mock") Shell.useMock();
      else if (act === "salir") salir();
    });
    root.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.id === "aj-nueva") { e.preventDefault(); anadirArea(root); }
    });
  }

  function actualizarBarra(root) {
    var bar = $(".aj-guardar", root); if (!bar) return;
    var chip = $(".chip", bar), tiny = $(".tiny", bar);
    if (dirty && !chip) { if (tiny) tiny.outerHTML = '<span class="chip warn">CAMBIOS SIN GUARDAR</span>'; var d = $("[data-act=descartar]", bar); if (d) d.disabled = false; }
  }

  function anadirArea(root) {
    var input = $("#aj-nueva", root);
    var nombre = String((input ? input.value : nuevaArea) || "").trim();
    if (!nombre) { Shell.toast("Escribe el nombre del área", "warn"); if (input) input.focus(); return; }
    var id = slugUnico(nombre, draft.areas);
    var short = nombre.replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 3) || "AR" + draft.areas.length;
    var usados = draft.areas.map(function (a) { return a.short; });
    var s2 = short, n = 2; while (usados.indexOf(s2) >= 0) s2 = short.slice(0, 3) + (n++);
    draft.areas.push({ id: id, name: nombre.toUpperCase(), short: s2, color: "#c2c8d0", fill: "#232b33", gcolor: "GRAY", fixed_sessions: 0 });
    nuevaArea = ""; tocar(); render(root);
  }

  async function quitarArea(idx, root) {
    var a = draft.areas[idx]; if (!a) return;
    var enUso = (S.week && S.week.tasks || []).filter(function (t) { return t.area === a.id; }).length;
    if (enUso) { Shell.toast("No se puede quitar «" + a.name + "»: tiene " + U.plural(enUso, "tarea") + " en la semana activa", "bad"); return; }
    if (draft.areas.length <= 1) { Shell.toast("Tiene que quedar al menos un área", "bad"); return; }
    var ok = await Shell.confirm({ title: "Quitar área", msg: "Se quitará «" + a.name + "» de los ajustes. Las semanas cerradas conservan sus datos con el id " + a.id + ".", ok: "Quitar", danger: true });
    if (!ok) return;
    draft.areas.splice(idx, 1); tocar(); render(root);
  }

  async function releer(root) {
    S.ui.busy++; Shell.renderStatus();
    try { var d = await API.listCalendars(); S.calendars = d.calendars || []; Shell.toast("Calendarios releídos: " + S.calendars.length, "ok"); }
    catch (e) { Shell.toast(e.message || String(e), "bad"); }
    finally { S.ui.busy = Math.max(0, S.ui.busy - 1); Shell.renderStatus(); render(root); }
  }

  function validar(d) {
    var errores = [];
    if (!String(d.app_name || "").trim()) errores.push("el nombre de la app no puede estar vacío");
    try { var f = U.parseIso(d.first_week_start); if (U.isoDate(U.mondayOf(f)) !== d.first_week_start) errores.push("la primera semana debe ser un lunes"); }
    catch (e) { errores.push("la fecha de la primera semana no es válida"); }
    if (!(d.cal_start_hour >= 0 && d.cal_start_hour <= 12)) errores.push("la hora de inicio debe estar entre 00:00 y 12:00");
    if (!(d.cal_end_hour > d.cal_start_hour && d.cal_end_hour <= d.cal_start_hour + 24)) errores.push("la hora de fin no es válida");
    if (!d.areas.length) errores.push("hace falta al menos un área");
    var ids = {}, nombres = {}, shorts = {};
    d.areas.forEach(function (a) {
      a.name = String(a.name || "").trim().toUpperCase(); a.short = String(a.short || "").trim().toUpperCase().slice(0, 4);
      if (!a.id) errores.push("un área no tiene id");
      if (!a.name) errores.push("un área no tiene nombre");
      if (!a.short) errores.push("«" + a.name + "» no tiene abreviatura");
      if (ids[a.id]) errores.push("id repetido: " + a.id); ids[a.id] = 1;
      if (nombres[a.name]) errores.push("nombre repetido: " + a.name); nombres[a.name] = 1;
      if (shorts[a.short]) errores.push("abreviatura repetida: " + a.short); shorts[a.short] = 1;
      if (!hexOk(a.color)) errores.push("color no válido en " + a.name);
      if (!hexOk(a.fill)) errores.push("relleno no válido en " + a.name);
      if (GCOLORS.indexOf(a.gcolor) < 0) a.gcolor = "GRAY";
      a.fixed_sessions = Math.max(0, parseInt(a.fixed_sessions, 10) || 0);
    });
    return errores;
  }

  async function guardar() {
    asegurarBorrador();
    var d = U.deepClone(draft);
    var errores = validar(d);
    if (errores.length) { Shell.toast("Revisa: " + errores.join("; "), "bad"); return; }
    await S.act({
      snapshot: function () { return U.deepClone(S.settings); },
      restore: function (s) { S.settings = s; },
      apply: function () { S.settings = Dominio.normaliseSettings(d); },
      request: function () { return API.saveSettings(d); },
      after: function (data) {
        S.settings = Dominio.normaliseSettings(data.settings);
        dirty = false; draft = null;
        Shell.toast("Ajustes guardados", "ok");
      }
    });
  }

  async function probar(root) {
    var url = ($("#aj-url", root) || {}).value || "", key = ($("#aj-key", root) || {}).value || "";
    var out = $("#aj-ping", root);
    var previa = API.config();
    try {
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url.trim())) throw new Error("La URL debe ser la de /exec del Web App");
      API.configure({ transport: "apps", backendUrl: url.trim(), key: key.trim() });
      var t0 = Date.now();
      var r = await API.ping();
      var ms = Date.now() - t0;
      if (out) out.textContent = "Responde: versión " + (r.version || "?") + " · zona " + (r.tz || "?") + " · " + ms + " ms";
      Shell.toast("El backend responde (" + ms + " ms)", "ok");
    } catch (e) {
      if (out) out.textContent = "Sin respuesta: " + (e.message || e);
      Shell.toast(e.message || String(e), "bad");
    } finally { API.configure(previa); }
  }

  function conectar(root) {
    var url = (($("#aj-url", root) || {}).value || "").trim(), key = (($("#aj-key", root) || {}).value || "").trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url)) { Shell.toast("La URL debe ser la de /exec del Web App", "bad"); return; }
    if (!key) { Shell.toast("Falta la clave", "bad"); return; }
    dirty = false; draft = null;
    Shell.useBackend(url, key);
  }
  async function salir() {
    var ok = await Shell.confirm({ title: "Salir", msg: "Se borrará la clave guardada en este navegador. Los datos del backend no se tocan.", ok: "Salir", danger: true });
    if (ok) Shell.logout();
  }

  function render(root) {
    asegurarBorrador();
    root.innerHTML = html();
    bind(root);
    var cuerpo = $("#aj-datos-cuerpo", root);
    if (cuerpo && typeof Datos !== "undefined") Datos.renderInto(cuerpo);
  }

  return { render: render, GCOLORS: GCOLORS, _draft: function () { return draft; }, _dirty: function () { return dirty; }, descartar: function () { dirty = false; draft = null; } };
})();


/* ==== 61-datos.js ==== */
/* Datos — centro de mantenimiento (docs/diseno.md §7, app.py 1079-1243): copia ahora,
   exportar, importar, borrar historial, reiniciar. Se pinta dentro de AJUSTES. */
var Datos = (function () {
  var ultimaCopia = null;   // {name, url} de la última copia hecha en esta sesión

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return U.esc(s); }

  function html() {
    var cerradas = Object.keys(S.index || {}).length;
    var lb = (S.meta && S.meta.last_backup) || null;
    return '<div class="dt-meta">' +
      '<div class="metric"><div class="k">SEMANAS CERRADAS</div><div class="v">' + cerradas + '</div><div class="s">activa: ' + esc(S.weekKey() || "—") + '</div></div>' +
      '<div class="metric"><div class="k">ÚLTIMA COPIA</div><div class="v">' + esc(lb ? U.formatDateTime(lb) : "—") + '</div><div class="s">' +
      (ultimaCopia ? (ultimaCopia.url && ultimaCopia.url !== "#mock" ? '<a class="dt-enlace" href="' + esc(ultimaCopia.url) + '" target="_blank" rel="noopener">' + esc(ultimaCopia.name) + '</a>' : esc(ultimaCopia.name)) : "en Drive, carpeta «Bitácora — copias»") + '</div></div>' +
      '</div>' +
      '<div class="dt-grid">' +
      item("copia", "Copia de seguridad ahora", "Guarda un volcado JSON completo en Drive. El backend hace una cada noche y antes de cerrar semana.", "Crear copia", "primary") +
      item("exportar", "Exportar JSON", "Descarga el volcado completo (ajustes, semanas, historial) a este dispositivo.", "Exportar") +
      item("importar", "Importar JSON", "Sustituye TODO por un volcado exportado antes. Se hace copia previa. Las sesiones de la semana abierta se siguen leyendo del calendario.", "Elegir archivo…") +
      item("borrar", "Borrar historial", "Elimina las semanas cerradas y conserva la semana activa y los ajustes. Se hace copia previa.", "Borrar historial", "danger", true) +
      item("reiniciar", "Reiniciar todo", "Ajustes por defecto y semana en blanco. No borra eventos del calendario. Se hace copia previa.", "Reiniciar", "danger", true) +
      '</div><input type="file" id="dt-file" accept="application/json,.json" hidden>';
  }
  function item(act, titulo, desc, boton, kind, peligro) {
    return '<div class="dt-item' + (peligro ? " peligro" : "") + '"><div class="t">' + esc(titulo) + '</div><div class="d">' + esc(desc) + '</div>' +
      '<div><button class="btn ' + (kind || "") + ' compact" data-dact="' + act + '">' + esc(boton) + '</button></div></div>';
  }

  function renderInto(el) {
    el.innerHTML = html();
    el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-dact]"); if (!b || b.disabled) return;
      var act = b.getAttribute("data-dact");
      if (act === "copia") copia();
      else if (act === "exportar") exportar();
      else if (act === "importar") { var f = $("#dt-file", el); if (f) f.click(); }
      else if (act === "borrar") borrarHistorial();
      else if (act === "reiniciar") reiniciar();
    });
    var file = $("#dt-file", el);
    if (file) file.addEventListener("change", function () {
      var f = file.files && file.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { importarTexto(String(r.result || "")); };
      r.onerror = function () { Shell.toast("No se pudo leer el archivo", "bad"); };
      r.readAsText(f);
      file.value = "";
    });
  }

  async function conEspera(fn) {
    S.ui.busy++; Shell.renderStatus();
    try { return await fn(); }
    catch (e) { S.ui.lastError = e && e.message ? e.message : String(e); Shell.toast(S.ui.lastError, "bad"); return null; }
    finally { S.ui.busy = Math.max(0, S.ui.busy - 1); Shell.render(); }
  }

  function copia() {
    return conEspera(async function () {
      var d = await API.backup("manual");
      ultimaCopia = { name: d.name, url: d.url };
      if (S.meta) S.meta.last_backup = U.isoDateTime(new Date());
      Shell.toast("Copia creada: " + d.name, "ok");
      return d;
    });
  }

  /* opts.descargar=false devuelve los datos sin lanzar la descarga (pruebas) */
  function exportar(opts) {
    opts = opts || {};
    return conEspera(async function () {
      var d = await API.exportAll();
      var data = d.data;
      if (opts.descargar !== false) {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "bitacora-" + U.todayIso() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
        Shell.toast("Exportado " + a.download, "ok");
      }
      return data;
    });
  }

  function validarVolcado(data) {
    if (!data || typeof data !== "object") return "no es un objeto JSON";
    if (!data.weeks || typeof data.weeks !== "object") return "falta «weeks»";
    if (!data.meta || typeof data.meta !== "object") return "falta «meta»";
    if (data.version == null) return "falta «version»";
    return null;
  }

  async function importarTexto(texto) {
    var data;
    try { data = JSON.parse(texto); } catch (e) { Shell.toast("El archivo no es JSON válido", "bad"); return null; }
    return importarDatos(data);
  }

  async function importarDatos(data) {
    var problema = validarVolcado(data);
    if (problema) { Shell.toast("El archivo no contiene un volcado válido de Bitácora: " + problema, "bad"); return null; }
    var n = Object.keys(data.weeks).length;
    var ok = await Shell.confirm({
      title: "Importar volcado", kicker: "IMPORTAR",
      msg: "Se sustituirán TODOS los datos del backend por este volcado (" + U.plural(n, "semana") + ", exportado " + (data.exported_at ? U.formatDateTime(data.exported_at) : "—") + "). Antes se hace una copia de seguridad.",
      ok: "Importar", danger: true
    });
    if (!ok) return null;
    return conEspera(async function () {
      await API.importAll(data);
      await recargar();
      Shell.toast("Volcado importado", "ok");
      return true;
    });
  }

  async function borrarHistorial() {
    var n = Object.keys(S.index || {}).length;
    var ok = await Shell.confirm({
      title: "Borrar historial", kicker: "PELIGRO",
      msg: "Se eliminarán " + U.plural(n, "semana cerrada", "semanas cerradas") + ". La semana activa y los ajustes se conservan. Antes se hace una copia de seguridad.",
      ok: "Borrar historial", danger: true, typed: "BORRAR"
    });
    if (!ok) return null;
    return conEspera(async function () {
      await API.clearHistory();
      await recargar();
      Shell.toast("Historial borrado", "ok");
      return true;
    });
  }

  async function reiniciar() {
    var ok = await Shell.confirm({
      title: "Reiniciar todo", kicker: "PELIGRO",
      msg: "Se borrarán TODAS las semanas y los ajustes volverán a los valores por defecto. Los eventos del calendario no se tocan. Antes se hace una copia de seguridad.",
      ok: "Reiniciar", danger: true, typed: "REINICIAR"
    });
    if (!ok) return null;
    return conEspera(async function () {
      await API.resetAll();
      await recargar();
      if (typeof Ajustes !== "undefined") Ajustes.descartar();
      Shell.toast("Bitácora reiniciada", "ok");
      return true;
    });
  }

  async function recargar() {
    S.weeks = {}; S.ui.histKey = null; S.ui.month = null;
    await S.load();
  }

  return { renderInto: renderInto, copia: copia, exportar: exportar, importarTexto: importarTexto, importarDatos: importarDatos, borrarHistorial: borrarHistorial, reiniciar: reiniciar };
})();


/* ==== 99-arranque.js ==== */
/* Arranque: va el último para que todos los módulos existan. */
(function () {
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { });
    });
  }
  if (document.getElementById("app")) Shell.boot();   // pruebas.html no tiene #app y no arranca

  /* Gancho de desarrollo: index.html#eval=<js> evalúa el código cuando la app está lista y deja
     el resultado en <pre id="out" hidden>. Lo usa herramientas/navegador.py --eval --app. */
  if (location.hash.indexOf("#eval=") === 0 && document.getElementById("app")) {
    (async function () {
      var pre = document.createElement("pre"); pre.id = "out"; pre.hidden = true; document.body.appendChild(pre);
      try {
        var t0 = Date.now();
        while (!S.ready && Date.now() - t0 < 20000) await new Promise(function (r) { setTimeout(r, 50); });
        await new Promise(function (r) { setTimeout(r, 150); });
        var src = decodeURIComponent(location.hash.slice(6)).trim();
        var AF = Object.getPrototypeOf(async function () { }).constructor;
        var intentos = ["return (" + src.replace(/;\s*$/, "") + ");"], idx = src.length;
        while ((idx = src.lastIndexOf(";", idx - 1)) > 0) intentos.push(src.slice(0, idx + 1) + "\nreturn (" + src.slice(idx + 1).replace(/;\s*$/, "").trim() + ");");
        intentos.push(src);
        var fn = null, err = null;
        for (var i = 0; i < intentos.length && !fn; i++) { try { fn = new AF(intentos[i]); } catch (e) { err = e; if (!(e instanceof SyntaxError)) throw e; } }
        if (!fn) throw err;
        var v = await fn();
        pre.textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2);
      } catch (e) { pre.textContent = "ERROR: " + (e && e.stack ? e.stack : e); }
    })();
  }
})();
